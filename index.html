n":"service","fromMemory":true,"skill":"Charging method","stem":"A thermostatic expansion valve (TXV) coil with a manufacturer charging chart is most often charged by:","choices":["Superheat only, as if it were a fixed orifice","Subcooling (and the data plate / chart) — not a piston-coil superheat chart","Ohm’s law","IFGC longest-length pipe tables"],"answer":1,"why":"TXV holds superheat by design, so many charts use subcooling to set charge. Fixed-orifice systems more often use superheat. Always obey the equipment chart.","help":"TXV → often subcooling. Piston → often superheat.","explain":["That is the usual piston / fixed-orifice method.","Correct, subject to the nameplate.","Electrical.","Gas pipe."]},{"id":"q65","lesson":"charge","track":"refrigeration","domain":"service","fromMemory":true,"skill":"Airflow vs charge","stem":"Low suction, high superheat, and a dirty filter is most honestly treated as:","choices":["Add two pounds of refrigerant immediately","An airflow defect until the filter and coil air path are restored, then re-evaluate charge","A failed high-pressure control only","A cooling-tower bleed problem"],"answer":1,"why":"Starved airflow looks like a starved coil. Charge last, air first, then use superheat (SH) and subcooling (SC) together.","help":"Fix the filter before the tank.","explain":["You may be stacking charge on a dirty-filter lie.","Correct.","High-pressure control is condenser-side protection.","Wrong system."]},{"id":"q66","lesson":"txv","track":"refrigeration","domain":"components","fromMemory":true,"skill":"Receiver vs accumulator","stem":"A receiver vs a suction accumulator:","choices":["They are the same part on the suction line","Receiver stores spare liquid after the condenser; accumulator protects the compressor from liquid on the suction line","Receiver is only used on dryers; accumulator is only used on hoods","Both replace the TXV"],"answer":1,"why":"Different jobs, different locations. Mixing the names is a free miss.","help":"Receiver = extra liquid. Accumulator = compressor protection.","explain":["Different piping locations.","Correct.","Those are air devices.","The TXV still meters."]},{"id":"q67","lesson":"txv","track":"refrigeration","domain":"components","fromMemory":true,"skill":"TXV bulb","stem":"The TXV sensing bulb belongs:","choices":["On the liquid line at the drier","On the suction line at the evaporator outlet, strapped as the manufacturer shows","Inside the compressor crankcase","On the gas manifold"],"answer":1,"why":"The bulb reads evaporator-outlet superheat. A loose or misplaced bulb makes the valve hunt or starve.","help":"Bulb follows the suction gas leaving the coil.","explain":["Liquid line is subcooling territory.","Correct.","Wrong device.","Wrong trade."]},{"id":"q68","lesson":"controls","track":"electrical","domain":"controls","fromMemory":true,"skill":"Safety switches","stem":"A high-pressure cutout on a refrigeration circuit is there to:","choices":["Prove flame on a gas burner","Stop the compressor when discharge pressure is unsafe (blocked condenser, failed fan, overcharge pattern)","Record an OSHA 1904 amputation","Size combustion-air openings"],"answer":1,"why":"It is a pressure safety, usually in series with control power. Do not jump it out to “see if it runs” on a live system.","help":"High side too high → stop.","explain":["That is a flame-prove / rollout family.","Correct.","Wrong book.","Wrong book."]},{"id":"q69","lesson":"controls","track":"electrical","domain":"controls","fromMemory":true,"skill":"Series safeties","stem":"Several safety switches in series with 24-volt control power means:","choices":["Any one open safety can stop the sequence","All safeties must open before anything stops","Safeties only work on 240-volt heaters","You should remove them for the exam"],"answer":0,"why":"Series = one open break stops current. Diagnose which switch is open. The wiring diagram is the map.","help":"One open = quiet unit.","explain":["Correct.","That would be a strange parallel story.","Control voltage is often 24 V; follow the diagram.","Never."]},{"id":"q70","lesson":"osha","track":"exam","domain":"safety","fromMemory":true,"pending":true,"skill":"OSHA 1904","stem":"A fatality or severe injury reporting clock on a job is found in:","choices":["2024 IFGC vent tables","OSHA 29 CFR Part 1904 — confirm the current hours in the copy you bring","The ADI calculator velocity window","A2L refrigerant safety class only"],"answer":1,"why":"1904 is recording and reporting. Do not memorize hours from a blog. PENDING: that you have the permitted 1904 text in the room.","help":"Hurt worker, reporting clock → 1904.","explain":["Venting.","Correct. Look up the clock.","Air tool.","Refrigerant class."]},{"id":"q71","lesson":"osha","track":"exam","domain":"safety","fromMemory":true,"skill":"Book split","stem":"Who may advertise air-conditioning contracting in Texas vs when a job amputation must be reported:","choices":["Both are only in the IMC","Advertising / contracting → Occupations Code 1302 and TAC 75; severe-injury reporting → OSHA 1904","Both are only in Manual J","Both are ADI-wheel problems"],"answer":1,"why":"Two different books, two different stems. Read the stem for the family before you hunt a heading.","help":"Texas license vs federal injury log.","explain":["IMC is mechanical install.","Correct.","Load calc.","Duct tool."]},{"id":"q72","lesson":"heat","track":"refrigeration","domain":"principles","skill":"Sensible vs latent","stem":"Superheat is:","choices":["Latent heat added while liquid is still boiling","Sensible heat added to vapor after all liquid has boiled (actual vapor °F − saturation °F)","The same as subcooling","A duct friction rate"],"answer":1,"why":"Once the refrigerant is all vapor, extra degrees are superheat. Subcooling is extra cooling of liquid on the high side.","help":"Vapor hotter than saturated = SH.","explain":["Boiling at saturation is latent.","Correct.","Opposite side of the system.","Air-side."]},{"id":"q73","lesson":"combustion","track":"code","domain":"combustion-air","fromMemory":true,"skill":"Starved combustion","stem":"A tight house with a new powerful kitchen exhaust and an atmospheric gas water heater that now rolls out is a picture of:","choices":["Too much combustion air","Building depressurization stealing combustion / dilution air — makeup air and IFGC combustion-air rules, not a bigger orifice","A TXV hunting","A dryer-lint screw problem only"],"answer":1,"why":"Exhaust without makeup air can backdraft Category I appliances. Fix the air, do not drill the orifice.","help":"What left the house must be replaced.","explain":["Roll-out is starvation or spillage, not extra air.","Correct.","Wrong trade picture.","Related only if the dryer is the exhaust that stole the air — still an air-balance / combustion-air story."]},{"id":"q74","lesson":"hoods","track":"code","domain":"ventilation","fromMemory":true,"skill":"Type II","stem":"A dishwasher / steam-table hood with no grease-laden cooking is typically:","choices":["Type I grease hood with a fire-rated grease duct","Type II heat/steam hood — confirm listing and the mechanical-code chapter","A Category IV furnace vent","A suction accumulator"],"answer":1,"why":"No grease stream, no Type I grease duct. Still a listed hood with exhaust and often makeup air. Confirm in 2024 IMC/UMC.","help":"Steam and heat, not fryer grease.","explain":["Type I is grease.","Correct.","IFGC venting.","Refrigeration part."]},{"id":"q75","lesson":"flex","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Compression math","stem":"Cut length 20 feet, installed length 14 feet. Compression percent?","choices":["4%","15%","30%","50%"],"answer":2,"why":"(20 − 14) ÷ 20 × 100 = 30%. That is a badly bunched run. Stretch it. Do not just upsize around it.","help":"6 ÷ 20 = 0.30.","explain":["4% is near-stretched baseline, not this math.","15% would be a 17-foot install on 20 feet of cut.","Correct. 30%.","10 ÷ 20 would be 50%, and that is not these numbers."]},{"id":"q80","lesson":"loads","track":"code","domain":"equipment-design","skill":"Manual J","stem":"What is ACCA Manual J used for on a residential job?","choices":["Selecting the furnace heat exchanger material","Calculating the room-by-room heating and cooling load","Sizing the refrigerant liquid line only","Writing the city of Katy permit notes"],"answer":1,"why":"Manual J is the load calculation. Manual S selects equipment. Manual D sizes ducts.","help":"J = load. S = equipment. D = ducts."},{"id":"q81","lesson":"loads","track":"code","domain":"equipment-design","skill":"Manual S","stem":"You have a finished Manual J. Which manual do you open next to pick the outdoor unit and indoor coil?","choices":["Manual D","Manual T","Manual S","Manual J again"],"answer":2,"why":"Manual S matches equipment capacity to the load. Do not skip from J straight to a catalog tonnage guess.","help":"S is selection."},{"id":"q82","lesson":"loads","track":"code","domain":"equipment-design","skill":"Oversizing","stem":"A cooling system is sized far above the Manual J load. What is the common comfort problem?","choices":["The coil never reaches saturation","Short runtime, poor dehumidification, and wide temperature swings","The compressor oil always returns faster","Static pressure always drops to zero"],"answer":1,"why":"Oversized cooling short-cycles. Latent load does not get pulled down. Rooms feel cold and clammy.","help":"Runtime is how moisture leaves the air."},{"id":"q83","lesson":"loads","track":"code","domain":"equipment-design","skill":"Tonnage","stem":"A unit is listed at 36,000 Btu/h cooling. What nominal tonnage is that?","choices":["2 tons","2.5 tons","3 tons","4 tons"],"answer":2,"why":"1 ton of cooling = 12,000 Btu/h. 36,000 ÷ 12,000 = 3 tons.","help":"Divide by 12,000."},{"id":"q84","lesson":"loads","track":"electrical","domain":"equipment-design","skill":"Nameplate voltage","stem":"A condensing unit nameplate says 208/230 V, 1Ø. The job has 208 V three-phase only. What is the issue?","choices":["208 V single-phase and 208 V three-phase are the same winding","The listed motor is single-phase; three-phase power is not a match","Any voltage within 20% is always legal","You can ignore phase if the breaker size matches"],"answer":1,"why":"Phase and voltage both have to match the nameplate. 208 V three-phase is not 208/230 V single-phase.","help":"Read phase, not only the number."},{"id":"q85","lesson":"loads","track":"code","domain":"equipment-design","skill":"Code year","stem":"For a PSI Class A exam on or after September 1, 2026, which mechanical code year is in the approved list?","choices":["2015 IMC","2018 UMC","2021 IMC only","2024 IMC / UMC / IFGC"],"answer":3,"why":"The current bulletin points at 2024 IMC, UMC, and IFGC for exams on or after that date.","help":"Exam code is 2024. Field city code can differ."},{"id":"q86","lesson":"loads","track":"code","domain":"equipment-design","skill":"Capacity vs load","stem":"Manual J cooling load is 28,400 Btu/h. A 2-ton unit is 24,000 Btu/h. What is the honest next step?","choices":["Install the 2-ton and hope the house is shady","Pick equipment with Manual S that can cover the load without wild oversize","Always jump to 5 tons so it “never struggles”","Ignore J and size from square footage only"],"answer":1,"why":"The 2-ton is short of the load. Selection is Manual S against J, not a square-foot rule of thumb.","help":"Do not undersize cooling to “save money.”"},{"id":"q87","lesson":"ducts","track":"code","domain":"equipment-design","skill":"Manual D","stem":"What does ACCA Manual D size?","choices":["The refrigerant charge in ounces","The duct system from the equipment airflow and available static","The gas pipe only","The condensate trap depth"],"answer":1,"why":"Manual D is residential duct design. Airflow and friction rate come from the equipment and the fitting losses.","help":"D = ducts."},{"id":"q88","lesson":"loads","track":"code","domain":"equipment-design","skill":"SEER2","stem":"SEER2 is best described as:","choices":["A Texas license class","A seasonal cooling-efficiency rating used on current equipment labels","The static pressure at the filter rack","The IFGC vent category"],"answer":1,"why":"SEER2 is the current seasonal energy efficiency ratio on cooling equipment. It is not a code chapter.","help":"Efficiency label, not a license."},{"id":"q89","lesson":"loads","track":"electrical","domain":"equipment-design","skill":"MCA / MOP","stem":"On a condensing-unit nameplate, MCA and MOP (or max fuse) are used to:","choices":["Set superheat","Size the branch-circuit conductors and the overcurrent device","Pick the filter MERV","Set the gas manifold pressure"],"answer":1,"why":"Minimum circuit ampacity sizes the wire. Maximum overcurrent protection sizes the breaker or fuse. Do not mix them up.","help":"MCA = wire. MOP = breaker."},{"id":"q90","lesson":"gastest","track":"code","domain":"testing","skill":"Gas leak test","stem":"A fuel-gas piping tightness test is performed with:","choices":["The appliances firing at high fire","A listed test method, typically air or inert gas, with appliances isolated as the code requires","Refrigerant vapor from a recovery cylinder","House water at city pressure"],"answer":1,"why":"Codes want a pressure test with a listed medium. Do not test with the appliances burning, and do not use refrigerant as a test gas.","help":"Isolate. Pressurize as listed. Watch the gauge."},{"id":"q91","lesson":"gastest","track":"code","domain":"testing","skill":"Manometer","stem":"You are checking a gas furnace manifold pressure. The right instrument is:","choices":["A refrigerant gauge manifold on the liquid line","A manometer or listed gas-pressure gauge at the manufacturer tap","A clamp meter on the gas valve coil only","A sling psychrometer"],"answer":1,"why":"Manifold pressure is inches of water column. Use a manometer on the tap the instructions name.","help":"Inches w.c., not psig refrigerant gauges."},{"id":"q92","lesson":"static","track":"code","domain":"testing","skill":"Total external static","stem":"Total external static pressure (TESP) on a residential air handler is typically:","choices":["The difference between return-side and supply-side static across the equipment, excluding the coil if the manufacturer says so","The gas manifold pressure converted to inches","Suction pressure minus discharge pressure","Only the filter pressure drop"],"answer":0,"why":"TESP is the external resistance the blower sees. Measure where the manufacturer tells you. Compare it with the blower chart.","help":"Supply static plus return static (as listed)."},{"id":"q93","lesson":"static","track":"code","domain":"testing","skill":"Airflow check","stem":"A fast field check that airflow is in the ballpark on a cooling coil is:","choices":["Ignoring temperature split if amps look fine","Measuring temperature split / Delta-T and comparing it with the charging chart after airflow is set","Closing returns until the compressor sounds loaded","Adding refrigerant until suction is 60 psig on every refrigerant"],"answer":1,"why":"Airflow first, then charge. Temperature split is a check, not a license to skip static and blower speed.","help":"Air, then charge."},{"id":"q94","lesson":"ohms","track":"electrical","domain":"testing","skill":"Continuity","stem":"A fuse is pulled from a de-energized circuit. A good fuse should read:","choices":["Open / OL on ohms","Near-zero ohms (continuity)","120 VAC on the ohms scale","The same as the breaker handle rating in kilohms"],"answer":1,"why":"A good fuse is a short length of conductor. It reads continuity. An open fuse reads OL. Test with power off.","help":"Power off. Continuity = good fuse."},{"id":"q95","lesson":"combustion","track":"code","domain":"testing","skill":"Combustion analysis","stem":"A combustion analyzer on a gas appliance is used to:","choices":["Measure refrigerant superheat","Read stack gases such as O2, CO, and CO2 so you can confirm safe, listed combustion","Set the TXV bulb charge","Prove duct leakage class"],"answer":1,"why":"Combustion analysis is flue gas. Carbon monoxide and oxygen tell you if the burn is complete and the heat exchanger path is behaving.","help":"Flue gas, not refrigerant."},{"id":"q96","lesson":"gastest","track":"code","domain":"testing","skill":"Lockup","stem":"Gas-valve lockup pressure is checked:","choices":["With the burner firing at high fire only","With the valve energized but the outlet blocked / burner off as the manufacturer directs, watching that outlet pressure does not creep above the listed limit","On the refrigerant suction port","By smelling the flue"],"answer":1,"why":"Lockup is how high the outlet climbs when flow stops. Too high can overfire or leak past. Follow the valve sheet.","help":"No flow. Watch the outlet gauge."},{"id":"q97","lesson":"power","track":"electrical","domain":"testing","skill":"Amp draw","stem":"A compressor running-load amp (RLA) check is most useful when you also know:","choices":["Only the color of the contactor","The nameplate RLA, the actual voltage, and that airflow and charge are already in range","The filter MERV only","The city permit number"],"answer":1,"why":"Amps without context lie. High amps can be low voltage, dirty condenser, overcharge, or a failing motor. Fix air and voltage first.","help":"Nameplate plus conditions."},{"id":"q98","lesson":"vac","track":"refrigeration","domain":"testing","skill":"Standing vacuum","stem":"After a deep vacuum, a standing-vacuum (decay) test is looking for:","choices":["Whether the compressor oil is acidic","A rise in microns that means a leak or leftover moisture/refrigerant","The exact superheat target","The gas manifold pressure"],"answer":1,"why":"If microns climb fast, something is still in the system or the system is leaking in. Isolate the pump so you are watching the system, not the pump.","help":"Valve off the pump. Watch the micron gauge."},{"id":"q99","lesson":"attic","track":"code","domain":"hvac-systems","skill":"Attic access","stem":"Equipment in an attic generally needs:","choices":["No opening if the unit is “small”","An opening, a passageway, and a service space sized as the mechanical code lists","A gas test port only","A window in the roof"],"answer":1,"why":"Codes require a usable path and working space so the unit can be serviced without tearing the house apart. Open the attic-access heading in IMC/UMC.","help":"Path + opening + work space."},{"id":"q100","lesson":"attic","track":"code","domain":"hvac-systems","skill":"Service lighting","stem":"A furnace or air handler in an attic typically also requires:","choices":["A swimming-pool bonding lug on the flue","A lighting outlet and a receptacle at or near the equipment, as the code lists","A condensate pump even if gravity drain works","A second gas meter"],"answer":1,"why":"You have to see and power tools. Codes call for a light and a receptacle in those service locations.","help":"Light and outlet at the unit."},{"id":"q101","lesson":"towers","track":"refrigeration","domain":"hvac-systems","skill":"Cooling tower","stem":"A cooling tower on a water-cooled chiller is rejecting heat to:","choices":["The evaporator barrel only","Outdoor air by evaporating a small amount of water and transferring condenser heat","The building supply ducts","The refrigerant suction accumulator"],"answer":1,"why":"Tower water takes condenser heat and dumps it to atmosphere. That is not the same loop as the chilled-water evaporator.","help":"Condenser heat out. Evaporator heat in from the building."},{"id":"q102","lesson":"cycle","track":"refrigeration","domain":"hvac-systems","skill":"Split system","stem":"A typical split-system air conditioner has:","choices":["Compressor, condenser, and metering device all in one rooftop box with no line set","An outdoor condensing unit and an indoor coil connected by a refrigerant line set","Only a gas furnace and no refrigerant","A cooling tower as the indoor coil"],"answer":1,"why":"Split = outdoor condensing unit + indoor coil. Packaged = everything in one cabinet.","help":"Line set means split."},{"id":"q103","lesson":"cycle","track":"refrigeration","domain":"hvac-systems","skill":"Heat pump","stem":"In heat-pump heating mode, the indoor coil is acting as the:","choices":["Evaporator","Metering device","Condenser","Cooling tower"],"answer":2,"why":"The reversing valve sends discharge vapor to the indoor coil so it can reject heat to the air. Indoor coil = condenser in heat.","help":"Heat indoors = indoor coil condensing."},{"id":"q104","lesson":"cycle","track":"refrigeration","domain":"hvac-systems","skill":"Defrost","stem":"Why does an air-source heat pump need a defrost cycle in heating?","choices":["To boil the compressor oil","Outdoor coil frost blocks airflow and heat transfer, so the system must melt it","To charge the accumulator with liquid","Because Manual J requires it"],"answer":1,"why":"The outdoor coil is the evaporator in heat. Moisture freezes on it. Defrost temporarily puts the unit in cooling so the outdoor coil becomes the condenser and melts the ice.","help":"Frost on the outdoor coil."},{"id":"q105","lesson":"towers","track":"code","domain":"hvac-systems","skill":"Packaged RTU","stem":"A packaged rooftop unit (RTU) is best described as:","choices":["An indoor air handler with a remote cooling tower only","Heating and/or cooling components in one outdoor cabinet that ducts into the building","A Mini-split head with no condensate","A gas range hood"],"answer":1,"why":"Packaged means the cycle lives in one box. Ducts, gas, and electric all land on that curb.","help":"One cabinet on the roof."},{"id":"q106","lesson":"charge","track":"refrigeration","domain":"hvac-systems","skill":"Dual fuel","stem":"A dual-fuel system typically pairs:","choices":["Two cooling towers","A heat pump with a fossil-fuel furnace, with a control that chooses which heat source runs","A DX coil with a cooling tower in series always","Two identical gas valves on one manifold"],"answer":1,"why":"Dual fuel = heat pump plus furnace. Below a balance-point or with a call for emergency heat, the furnace takes over.","help":"Electric heat pump + gas heat."},{"id":"q107","lesson":"filters","track":"code","domain":"air-distribution","skill":"Filter area","stem":"A high-MERV filter in a rack that is too small usually causes:","choices":["Lower static and more CFM","Higher pressure drop, less airflow, and a dirty-looking coil even if the filter is “better”","The compressor to run without refrigerant","Zero effect if MERV is higher"],"answer":1,"why":"Fine filters need enough face area. Stuffing a dense filter into a 1-inch slot can starve the blower.","help":"Area first, then MERV."},{"id":"q108","lesson":"ducts","track":"code","domain":"air-distribution","skill":"Return air","stem":"Closing supply registers to “force air to the back rooms” usually:","choices":["Raises total external static and can cut total CFM","Always balances the house legally","Lowers static and helps the coil","Changes only the gas pressure"],"answer":0,"why":"Blocking supply paths raises static. The blower walks back on its curve. Other rooms do not magically get the lost CFM.","help":"High static, less air."},{"id":"q109","lesson":"wheel","track":"code","domain":"air-distribution","skill":"Friction rate","stem":"On a duct calculator (ductulator), CFM and friction rate together are used to:","choices":["Pick a refrigerant","Select a round or rectangular duct size","Set lockup pressure","Calculate MCA"],"answer":1,"why":"The wheel relates airflow, friction per 100 ft, velocity, and size. You still have to add fittings as equivalent length.","help":"CFM + friction → size."},{"id":"q110","lesson":"ducts","track":"code","domain":"air-distribution","skill":"Equivalent length","stem":"A sharp 90° elbow in a duct run is accounted for by:","choices":["Ignoring it if the trunk is metal","Adding its equivalent length to the measured length before you size","Subtracting it from CFM","Doubling the refrigerant charge"],"answer":1,"why":"Fittings eat pressure like extra straight pipe. Manual D / the fitting tables give equivalent length. Skip them and the run is undersized.","help":"Elbows count as extra feet."},{"id":"q111","lesson":"filters","track":"code","domain":"air-distribution","skill":"Grilles","stem":"A supply grille that is too small for the CFM will typically:","choices":["Drop velocity and stop throwing air","Raise throw/velocity and can be noisy","Change the gas orifice size","Lower TESP to zero"],"answer":1,"why":"Too little free area → high velocity → noise and poor throw pattern. Size the grille to the CFM and the listed throw.","help":"Small grille, loud air."},{"id":"q112","lesson":"heat","track":"refrigeration","domain":"principles","skill":"Sensible heat","stem":"Sensible heat is the heat that:","choices":["Changes state at constant temperature","Changes temperature and is read on a dry-bulb thermometer","Only exists in the flue","Is always equal to latent heat"],"answer":1,"why":"Sensible = temperature change. Latent = state change (moisture) at constant temperature.","help":"Sensible is what the thermostat feels first."},{"id":"q113","lesson":"heat","track":"refrigeration","domain":"principles","skill":"Latent heat","stem":"Removing moisture from air at the cooling coil is primarily:","choices":["Sensible heating","Latent cooling (condensation)","Radiant heating from the compressor","A gas-combustion process"],"answer":1,"why":"Water vapor condensing on a cold coil is latent heat removal. That is how humidity drops.","help":"Wet coil = latent."},{"id":"q114","lesson":"heat","track":"refrigeration","domain":"principles","skill":"BTU","stem":"One British thermal unit (Btu) is approximately the heat to:","choices":["Melt a ton of ice in 24 hours","Raise 1 pound of water 1°F","Move 1 CFM through 1 inch of static","Power a 1-horsepower motor for 1 hour"],"answer":1,"why":"Classic definition: 1 Btu ≈ heat to raise 1 lb of water 1°F. A ton is 12,000 Btu/h.","help":"1 lb water, 1 degree."},{"id":"q115","lesson":"cycle","track":"refrigeration","domain":"principles","skill":"Saturation","stem":"Saturation temperature is the temperature where refrigerant:","choices":["Can no longer be compressed","Exists as liquid and vapor together at a given pressure","Is always 32°F","Has no pressure"],"answer":1,"why":"On the PT chart, a pressure maps to a saturation temperature. Superheat and subcooling are measured from that point.","help":"PT chart is saturation."},{"id":"q116","lesson":"controls","track":"electrical","domain":"controls","skill":"Thermostat","stem":"On a typical 24-volt heat-cool thermostat, the Y terminal calls:","choices":["The indoor blower only","Cooling / compressor contactor","Heat only","The reversing valve on every system"],"answer":1,"why":"Y is the compressor (cooling) call. G is fan. W is heat. O/B is reversing valve on heat pumps.","help":"Y = cool / compressor."},{"id":"q117","lesson":"controls","track":"electrical","domain":"controls","skill":"Safety switch","stem":"A float switch in a condensate pan is there to:","choices":["Add water to the trap","Stop the system (usually the Y or R circuit) if the pan is about to overflow","Raise static pressure","Change the TXV superheat"],"answer":1,"why":"It is a flood switch. Wire it so a rising pan shuts cooling down before water hits the ceiling.","help":"High water = shut off cooling."},{"id":"q118","lesson":"controls","track":"electrical","domain":"controls","skill":"Pressure switch","stem":"A high-pressure switch on a condensing unit opens when:","choices":["Suction is too low from a starved evaporator","Discharge pressure exceeds the cut-out setting","The thermostat is set to off","The filter is clean"],"answer":1,"why":"High-side safety. Dirty condenser, overcharge, or no outdoor airflow can push it out. Find the cause; do not just jumper it.","help":"High side too high."},{"id":"q119","lesson":"controls","track":"electrical","domain":"controls","skill":"Limit","stem":"A furnace high-limit switch trips. The honest first checks are:","choices":["Add more gas pressure","Airflow, dirty filter, closed returns, and heat-exchanger overheat — not a bigger orifice","The TXV bulb","The cooling tower basin"],"answer":1,"why":"Limit means the heat exchanger got too hot. That is almost always an air problem or a firing-rate problem, not “needs more gas.”","help":"Too hot. Move air."},{"id":"q120","lesson":"osha","track":"code","domain":"safety","skill":"OSHA 1904","stem":"OSHA 29 CFR Part 1904 is mainly about:","choices":["Refrigerant recovery vacuum levels","Recording and reporting work-related injuries and illnesses","Duct leakage testing","Fuel-gas pipe sizing"],"answer":1,"why":"1904 is the recordkeeping rule. Clocks, logs, and what counts as recordable live there — not IMC duct chapters.","help":"Injury log, not mechanical code."},{"id":"q121","lesson":"osha","track":"code","domain":"safety","skill":"PPE","stem":"When recovering refrigerant or opening a pressurized system, minimum practice includes:","choices":["No eye protection if you are “careful”","PPE the SDS and manufacturer list — typically eye protection and gloves — and recovery into listed cylinders","Venting to atmosphere to save time","Using a water hose as the recovery machine"],"answer":1,"why":"Pressure, oil, and refrigerant skin/eye injuries are real. Venting is illegal for most refrigerants. Use listed recovery gear.","help":"Protect eyes. Recover. Do not vent."},{"id":"q122","lesson":"osha","track":"code","domain":"safety","skill":"Ladders","stem":"On a roof or attic access, a portable ladder should:","choices":["Be set at a 4:1 angle, extend above the landing as listed, and be secured","Lean as steep as possible to save space","Be aluminum against a live service drop with no concern","Never extend above the roof edge"],"answer":0,"why":"OSHA ladder rules: 4:1 pitch, three feet above the landing unless a grab is provided, and do not play with power lines.","help":"4 to 1. Three rungs above."},{"id":"q123","lesson":"law","track":"code","domain":"texas-law","skill":"License","stem":"Texas Occupations Code Chapter 1302 is the chapter that:","choices":["Sets IMC duct leakage class","Governs air conditioning and refrigeration contracting in Texas","Replaces OSHA 1904","Lists ADI wheel scales"],"answer":1,"why":"1302 is the ACR contracting statute. 16 TAC Chapter 75 is the TDLR rule that fills it in.","help":"1302 = Texas ACR law."},{"id":"q124","lesson":"law","track":"code","domain":"texas-law","skill":"Class A","stem":"An Environmental Air Conditioning Class A license in Texas is aimed at:","choices":["Only window units under 1 ton","Environmental air work without the Class B tonnage cap — confirm the current TDLR definition in 1302 / TAC 75","Fuel-gas utility mains in the street","Plumbing drain waste and vent only"],"answer":1,"why":"Class A is the unlimited environmental air class. Class B has a tonnage limit. Read the current rule; do not memorize a blog.","help":"A is the big environmental class."},{"id":"q125","lesson":"law","track":"code","domain":"texas-law","skill":"Unlicensed work","stem":"Performing ACR contracting work in Texas without the required license is:","choices":["Fine if the homeowner says it is okay","A violation of Occupations Code 1302 / TDLR rules","Covered by a city of Katy 2021 permit alone","Allowed on any job under 5 tons"],"answer":1,"why":"The statute and TAC 75 require a license for contracting. A city permit does not replace the state license.","help":"License first."},{"id":"q126","lesson":"combustion","track":"code","domain":"combustion-air","skill":"Combustion air","stem":"Combustion air for a fuel-burning appliance is the air required to:","choices":["Cool the supply registers","Supply oxygen for the flame and, where listed, dilution of flue gases","Pressurize the condensate trap","Run the evaporator fan only"],"answer":1,"why":"No combustion air, incomplete burn, CO risk. Codes have indoor, outdoor, and combination methods. Open that chapter — do not guess cubic feet.","help":"Air for the fire."},{"id":"q127","lesson":"combustion","track":"code","domain":"combustion-air","skill":"Confined space","stem":"If a furnace is in a small mechanical closet that does not meet the indoor-air volume method, you typically:","choices":["Ignore it if the flame is blue","Bring in outdoor combustion air, or use another listed method, sized from the input Btu/h tables","Seal the closet tighter so the return can steal air","Raise manifold pressure 20%"],"answer":1,"why":"A tight closet is a confined space. Steal from the return and you can backdraft. Use the code method that matches the install.","help":"Small room → outdoor air or listed openings."},{"id":"q128","lesson":"combustion","track":"code","domain":"combustion-air","skill":"Louvers","stem":"When combustion-air openings are covered with louvers or screens, the code wants you to:","choices":["Ignore free area and use the rough opening only","Account for the free area of the louver/screen, not just the wood hole","Always assume 100% free area for decorative grilles","Close them in winter"],"answer":1,"why":"Metal louvers pass a fraction of the opening. If you size from the hole in the wall, the appliance can starve.","help":"Free area, not the framed hole."},{"id":"q129","lesson":"hoods","track":"code","domain":"ventilation","skill":"Makeup air","stem":"A large kitchen exhaust hood that pulls a lot of air out of a building also needs:","choices":["Nothing if the front door is undercut 1/2 inch","Makeup air so the building does not go tight-negative and backdraft other appliances","A smaller gas pipe","The cooling tower fan off"],"answer":1,"why":"Exhaust without makeup air steals from water heaters and furnaces. IMC/UMC have makeup-air triggers. Open that heading.","help":"What leaves must be replaced."},{"id":"q130","lesson":"salon","track":"code","domain":"ventilation","skill":"Nail salon","stem":"Nail-salon ventilation is treated as a special occupancy because:","choices":["The code wants extra heat only","Chemical vapors need listed exhaust / source capture, not just a bathroom fan","Manicure tables count as Type I hoods","No mechanical air is allowed"],"answer":1,"why":"Solvent and acrylic vapors are the issue. Look up the occupancy ventilation and any source-capture language. Do not invent a CFM from memory.","help":"Chemicals. Exhaust them."},{"id":"q131","lesson":"hoods","track":"code","domain":"ventilation","skill":"Type I hood","stem":"A Type I kitchen hood is for:","choices":["Dishwashers with no grease","Grease-laden cooking vapors, with listed grease filters and a fire-suppression interface as required","Toilet exhaust","Clothes dryers"],"answer":1,"why":"Type I = grease. Type II = steam/heat without grease. Do not put a Type II over a fryer.","help":"Grease = Type I."},{"id":"q132","lesson":"dryer","track":"code","domain":"venting","skill":"Dryer exhaust","stem":"A domestic clothes-dryer exhaust duct should:","choices":["Terminate indoors so the house gains heat","Be independent, terminate outdoors, and stay within the listed length and fitting count","Be combined with the furnace flue to save a roof jack","Use screws that snag lint on the inside of every joint"],"answer":1,"why":"Lint is a fire load. Separate duct, outdoor termination, smooth interior, length as listed. Male joints point downstream so lint does not catch.","help":"Outside. Smooth. Own duct."}],"resources":[{"title":"2024 Practice Test V2","note":"Current 125-question printable test","href":"https://drive.google.com/file/d/1tomQlTmC8UdpFqcsEMntMYpkXaQhsnmM/view","group":"packet"},{"title":"PSI Practice Desk Pack","note":"Rules, tab plan, lookup map","href":"https://drive.google.com/file/d/1zABFV1_hqaKZyERVkzSynvVN-2pyXfCF/view","group":"packet"},{"title":"2024 Code Lookup Pack","note":"IMC, IFGC, and UMC study map","href":"https://drive.google.com/file/d/1haQreg1yW__xWFaPETSJs0csbLDPqPC4/view","group":"packet"},{"title":"Inspection Memory Guide","note":"Condensate, ducts, gas, venting","href":"https://drive.google.com/file/d/1_Q0pbxGJb2xuOOi-1YLF1iRSOEuITJNP/view","group":"packet"},{"title":"A2L + Formula Tools","note":"Formulas and A2L review","href":"https://drive.google.com/file/d/1ELSnT34aTixn3t1XRqgs2F3jeqnm1gYo/view","group":"packet"},{"title":"Modern Refrigeration book map","note":"Chapter and page locators","href":"https://docs.google.com/spreadsheets/d/1LAN51SrJzLom2PmTnn2czURs4FRtbwxROQV1ClkJ7qM/edit","group":"packet"},{"title":"Study Library folder","note":"All exam packets in one Drive folder","href":"https://drive.google.com/drive/folders/1R2vda5-rwp-lbmfqDMWKZNkjepNm3sR_","group":"packet"},{"title":"Official PSI bulletin","note":"Public candidate bulletin","href":"https://test-takers.psiexams.com/api/content/bulletin/5994","group":"official"},{"title":"PSI scheduling","note":"Official scheduling portal","href":"https://test-takers.psiexams.com/tdlnrp","group":"official"},{"title":"TDLR exam page","note":"Texas ACR exam information","href":"https://www.tdlr.texas.gov/acr/acrexam.htm","group":"official"}],"paperBooks":["2024 Uniform Mechanical Code","2024 International Mechanical Code","2024 International Fuel Gas Code","Modern Refrigeration and Air Conditioning, 22nd Edition","ADI Duct Size Calculator","Texas Occupations Code Chapter 1302","16 TAC Chapter 75","OSHA 29 CFR Part 1904","ACCA Manual D, 2014 — confirm you own this edition","ACCA Manual J, 8th ed. v2.50 — confirm you own this edition","ACCA Manual S, 2014 — confirm you own this edition"],"trackLabel":{"electrical":"Electrical","refrigeration":"Refrigeration","code":"Code & law","exam":"Exam skills"},"EXAM_COUNT":125,"EXAM_SECONDS":13800,"domains":[{"id":"air-distribution","label":"Air distribution","count":18,"topics":"Airflow, ducts, filters, grilles, static pressure"},{"id":"equipment-design","label":"Equipment and design","count":14,"topics":"Loads, capacities, HVACR codes, voltage"},{"id":"service","label":"Service","count":12,"topics":"Electrical, diagnosis, recovery, superheat, subcooling"},{"id":"testing","label":"Testing","count":12,"topics":"Airflow, combustion, electrical, and gas tests"},{"id":"hvac-systems","label":"HVAC systems","count":11,"topics":"Components, installation, refrigeration systems"},{"id":"components","label":"Refrigeration components","count":6,"topics":"Compressors, coils, metering devices, refrigerants"},{"id":"combustion-air","label":"Combustion air","count":6,"topics":"Air for fuel-burning appliances"},{"id":"controls","label":"Controls","count":6,"topics":"General, pressure/safety, temperature"},{"id":"piping","label":"Piping","count":6,"topics":"Condensate, fittings, sizing, support, valves"},{"id":"principles","label":"Refrigeration principles","count":6,"topics":"Heat transfer, physics, system pressure"},{"id":"safety","label":"Safety","count":6,"topics":"OSHA reporting and job safety"},{"id":"texas-law","label":"Texas laws and rules","count":6,"topics":"Occupations Code 1302 and TAC 75"},{"id":"ventilation","label":"Ventilation","count":6,"topics":"Air equipment, machinery rooms, occupancy air"},{"id":"venting","label":"Venting","count":5,"topics":"Dryers, chimneys, vent assemblies"}],"lookupDrills":[{"id":"lu1","domain":"combustion-air","fromMemory":true,"pending":true,"stem":"A Category I gas furnace in a small closet needs combustion air openings. First book and heading family?","choices":["2024 IFGC — air for combustion and ventilation","OSHA 1904 — reporting hours","ADI wheel — friction rate","Modern Refrigeration — TXV bulb"],"answer":0,"heading":"IFGC: air for combustion / indoor and outdoor combustion air (confirm the exact section title in your book).","why":"Fuel-burning appliance air is IFGC, not a duct wheel and not an injury log.","explain":["Correct. Then find high/low openings vs outdoor-air ducts.","Wrong family.","Wrong tool.","Wrong book."]},{"id":"lu2","domain":"venting","fromMemory":true,"pending":true,"stem":"Maximum dryer-exhaust developed length and whether screws may sit in the airstream.","choices":["2024 IMC/UMC — clothes dryer exhaust","2024 IFGC — CSST bonding only","Chapter 1302 — advertising","Manual J — sensible load"],"answer":0,"heading":"IMC/UMC clothes dryer exhaust. Do not quote a 2021 Katy field number as the exam answer.","why":"Dryer exhaust is mechanical-code venting of lint-laden air.","explain":["Correct.","CSST is fuel-gas piping.","License law.","Load calc."]},{"id":"lu3","domain":"ventilation","fromMemory":true,"pending":true,"stem":"Type I hood, grease duct, and makeup air interlock.","choices":["2024 IMC/UMC — commercial kitchen exhaust / makeup air","P/T chart","OSHA 1904 log","ADI velocity window"],"answer":0,"heading":"Mechanical-code kitchen ventilation: hood type, grease duct, makeup air. PENDING exact section numbers.","why":"Kitchen exhaust is ventilation, not refrigeration physics.","explain":["Correct.","Refrigerant.","Injury log.","Duct tool after you know CFM."]},{"id":"lu4","domain":"ventilation","fromMemory":true,"pending":true,"stem":"Nail-salon source capture / occupancy outdoor air.","choices":["2024 IMC/UMC ventilation occupancy tables / nail salon heading","IFGC longest-length gas table","Ohm’s law triangle","TXV superheat chart"],"answer":0,"heading":"Ventilation chapter occupancy / listed nail-salon line. Do not invent CFM per station. PENDING table line.","why":"People and process air, not chimneys and not gas pipe.","explain":["Correct.","Gas pipe.","Electrical.","Charging."]},{"id":"lu5","domain":"air-distribution","fromMemory":true,"stem":"Flexible duct left compressed on a coil. Which references govern stretch, support, and listed install?","choices":["2024 IMC/UMC flexible-duct installation plus the ADI wheel for sizing after the run is stretched","OSHA 1904 only","Chapter 1302 only","IFGC vent termination only"],"answer":0,"heading":"Mechanical-code flex-duct install. ADI calculator for size/velocity/friction after the duct is actually a duct.","why":"Install first, then size. Compression is bunching, not compressor ratio.","explain":["Correct.","Injury log.","Who may contract.","Chimneys."]},{"id":"lu6","domain":"piping","fromMemory":true,"pending":true,"stem":"Condensate drain reduced one size before termination.","choices":["2024 IMC/UMC condensate disposal — size, slope, no reduction in direction of flow","IFGC combustion air","Manual S blower tables only","A2L leak detector listing only"],"answer":0,"heading":"Condensate disposal. PENDING exact table ID. Remember: no downstream reduction.","why":"Once sized, do not neck it down on the way out.","explain":["Correct.","Burner air.","Equipment selection.","Refrigerant class."]},{"id":"lu7","domain":"piping","fromMemory":true,"pending":true,"stem":"CSST bonding and steel-pipe size for a 120,000 Btu/h furnace.","choices":["2024 IFGC — CSST / gas pipe sizing tables","2024 IMC condensate only","ADI duct calculator","Modern Refrigeration cycle chapter only"],"answer":0,"heading":"IFGC: CSST bonding/grounding and pipe-sizing (longest length). PENDING table numbers.","why":"Gas + CSST + Btu/h is the fuel-gas book.","explain":["Correct.","Water from a coil.","Air.","Theory."]},{"id":"lu8","domain":"testing","fromMemory":true,"pending":true,"stem":"Pressure test of newly installed fuel-gas pipe before it is filled with gas.","choices":["2024 IFGC inspection / testing of gas piping","IMC dryer exhaust length","OSHA 1904 amputation clock","Manual J infiltration"],"answer":0,"heading":"IFGC test medium, pressure, duration. Air or inert gas — not oxygen.","why":"This is a testing-domain item in the gas book.","explain":["Correct.","Lint duct.","Injury reporting.","Load."]},{"id":"lu9","domain":"safety","fromMemory":true,"pending":true,"stem":"A worker is hospitalized overnight after a job-site fall. Reporting clock?","choices":["OSHA 29 CFR Part 1904 recording and reporting","IFGC vent category table","ADI friction window","UMC condensate slope only"],"answer":0,"heading":"1904 severe-event reporting. Confirm hours in your copy. PENDING that you own the permitted text.","why":"Hurt worker ≠ mechanical code.","explain":["Correct.","Chimney type.","Duct tool.","Drain."]},{"id":"lu10","domain":"texas-law","fromMemory":true,"stem":"A person advertises “AC SHARK — licensed HVAC” without a contractor license.","choices":["Texas Occupations Code Chapter 1302 and 16 TAC Chapter 75","2024 IMC Chapter on ducts","ADI calculator","P/T chart"],"answer":0,"heading":"1302 / TAC 75: contracting and advertising. Not a code table.","why":"Who may contract is law, not UMC.","explain":["Correct.","How you build ducts.","How you size air.","Refrigerant saturation."]},{"id":"lu11","domain":"hvac-systems","fromMemory":true,"pending":true,"stem":"Attic air handler: opening size, walkway, lighting, working clearance.","choices":["2024 IMC/UMC appliance access / attic installation / clearances plus the equipment listing","OSHA 1904 only","Chapter 1302 only","TXV charging chart only"],"answer":0,"heading":"Access and attic installation headings. PENDING exact dimensions in your edition. Do not quote a rumor inch.","why":"If you cannot service it, it is not installed.","explain":["Correct.","Injury log.","License law.","Charge."]},{"id":"lu12","domain":"service","fromMemory":true,"stem":"TXV system charging method vs piston coil.","choices":["Modern Refrigeration charging methods / equipment charging chart (TXV often subcooling; piston often superheat)","IFGC longest length","IMC dryer exhaust","OSHA 1904"],"answer":0,"heading":"Charging chapter + the data plate on the unit. Never mix the two charts.","why":"Service domain, refrigeration text, manufacturer chart.","explain":["Correct.","Gas pipe.","Lint.","Injury."]},{"id":"lu13","domain":"components","fromMemory":true,"stem":"Receiver vs suction accumulator — which chapter?","choices":["Modern Refrigeration — accessories / metering / accumulators","IFGC combustion air","UMC nail salon occupancy","1302 advertising"],"answer":0,"heading":"Components: receiver after condenser (spare liquid); accumulator on suction (compressor protection).","why":"Names live in the refrigeration text.","explain":["Correct.","Burner air.","Ventilation.","Law."]},{"id":"lu14","domain":"equipment-design","pending":true,"stem":"House load vs equipment match vs duct design.","choices":["Manual J (load), Manual S (select), Manual D (ducts) — confirm you own those editions","OSHA 1904","IFGC CSST only","A2L only"],"answer":0,"heading":"ACCA J / S / D as listed on the PSI bulletin. PENDING physical ownership.","why":"Three manuals, three jobs. The wheel does not replace J.","explain":["Correct.","Injury.","Gas tubing.","Refrigerant class."]},{"id":"lu15","domain":"air-distribution","fromMemory":true,"stem":"Return air from an attached garage.","choices":["2024 IMC/UMC return-air source limitations","IFGC pipe-sizing table","1904 fatality clock","P/T chart"],"answer":0,"heading":"Return-air sources / prohibited locations. Garage fumes do not belong in the occupied duct.","why":"Air distribution + indoor air quality, mechanical code.","explain":["Correct.","Gas pipe.","OSHA.","Refrigerant."]},{"id":"lu16","domain":"controls","fromMemory":true,"stem":"High-pressure cutout opens on a condensing unit.","choices":["Modern Refrigeration — pressure / safety controls, plus the unit wiring diagram","IMC dryer exhaust","1302 ads","Manual J infiltration"],"answer":0,"heading":"Safety controls chapter and the schematic. Do not jump the control on a live system to “see.”","why":"Controls domain. Pressure safety, series circuit.","explain":["Correct.","Lint.","Law.","Load."]}],"tabPlans":[{"id":"imc","book":"International Mechanical Code","edition":"2024","pending":true,"note":"Exam code year. City of Katy field work currently lists 2021 — do not tab 2021 as if it were the exam.","tabs":[{"label":"Condensate","heading":"Condensate disposal","color":"yellow","mark":"size, slope, trap, no downstream reduction, termination"},{"label":"Ducts","heading":"Duct construction / flex / return air","color":"yellow","mark":"stretch flex, garage return prohibited, seal joints"},{"label":"Dryers","heading":"Clothes dryer exhaust","color":"pink","mark":"length, fasteners out of the airstream, termination"},{"label":"Hoods","heading":"Commercial kitchen exhaust / makeup air","color":"pink","mark":"Type I grease vs Type II steam; makeup air"},{"label":"Ventilation","heading":"Ventilation occupancies","color":"yellow","mark":"nail salon / source capture — find the line, do not invent CFM"},{"label":"Access","heading":"Appliance access / attic","color":"yellow","mark":"opening, path, working clearance, lighting"}]},{"id":"umc","book":"Uniform Mechanical Code","edition":"2024","pending":true,"note":"Same exam year as the IMC. Headings may use different names — tab the equivalent, not a copied IMC page number.","tabs":[{"label":"Condensate","heading":"Condensate equivalent heading","color":"yellow","mark":"same pattern: size, no reduction, failure path"},{"label":"Ducts","heading":"Duct / flex / return equivalent","color":"yellow","mark":"install as listed"},{"label":"Dryers","heading":"Dryer exhaust equivalent","color":"pink","mark":"lint, length, termination"},{"label":"Hoods","heading":"Kitchen ventilation equivalent","color":"pink","mark":"hood type + makeup air"}]},{"id":"ifgc","book":"International Fuel Gas Code","edition":"2024","pending":true,"note":"If the stem says gas, CSST, vent category, combustion air, or Btu/h pipe size — this book first.","tabs":[{"label":"Comb. air","heading":"Air for combustion and ventilation","color":"pink","mark":"high/low openings, outdoor air, tight construction"},{"label":"Pipe size","heading":"Pipe sizing tables (longest length)","color":"green","mark":"Btu/h, length, specific gravity"},{"label":"CSST","heading":"CSST / bonding","color":"yellow","mark":"bonding/grounding as required"},{"label":"Test","heading":"Inspection and testing of piping","color":"pink","mark":"medium (not oxygen), pressure, duration"},{"label":"Vents","heading":"Chimneys and vents / categories","color":"yellow","mark":"Category I vs IV; termination clearances"},{"label":"Sediment","heading":"Appliance connections / sediment trap","color":"yellow","mark":"drip leg where required"}]},{"id":"mr","book":"Modern Refrigeration and Air Conditioning","edition":"22nd (2025)","pending":true,"note":"Theory, cycle, charging, controls, electrical, towers. Not the code table.","tabs":[{"label":"Ohm / P","heading":"Electrical fundamentals","color":"green","mark":"I = E ÷ R, P = I × E"},{"label":"Cycle","heading":"Four major components","color":"yellow","mark":"evaporator → compressor → condenser → metering device"},{"label":"SH / SC","heading":"Superheat and subcooling","color":"green","mark":"SH on suction; SC on liquid"},{"label":"Charge","heading":"Charging methods","color":"green","mark":"TXV often SC; piston often SH; weigh-in + chart"},{"label":"TXV","heading":"Metering devices / TXV / receivers","color":"yellow","mark":"bulb on suction outlet; receiver ≠ accumulator"},{"label":"Controls","heading":"Pressure and safety controls","color":"pink","mark":"HP/LP cutout; series safeties"},{"label":"Towers","heading":"Cooling towers / water-cooled","color":"yellow","mark":"water-side heat rejection"}]},{"id":"law","book":"Texas Occupations Code 1302 + 16 TAC 75","edition":"Current public text","pending":true,"note":"Who may contract, advertise, and supervise. Not how to size a drain.","tabs":[{"label":"License","heading":"When a contractor license is required","color":"yellow","mark":"Class A environmental air scope"},{"label":"Ads","heading":"Advertising","color":"pink","mark":"do not advertise the trade without the license"}]},{"id":"osha","book":"OSHA 29 CFR Part 1904","edition":"Permitted PSI text","pending":true,"note":"Recording and reporting occupational injuries. Confirm you physically have this.","tabs":[{"label":"Report","heading":"Reporting fatalities and severe injuries","color":"pink","mark":"look up the hours — do not blog-memorize"},{"label":"Record","heading":"What is recordable / 300 log","color":"yellow","mark":"recordkeeping vs reporting"}]},{"id":"acca","book":"ACCA Manual J / S / D","edition":"J 8th v2.50 · S 2014 · D 2014","pending":true,"note":"PENDING VERIFICATION that these three are in your bag. PSI lists them. A “complete” seller bundle may not.","tabs":[{"label":"J load","heading":"Sensible and latent load","color":"green","mark":"J calculates the house"},{"label":"S pick","heading":"Equipment selection","color":"yellow","mark":"S matches equipment to J"},{"label":"D ducts","heading":"Friction rate / effective length","color":"green","mark":"D + ADI wheel size the air path"}]},{"id":"adi","book":"ADI Duct Size Calculator","edition":"Your physical wheel","pending":true,"note":"Photograph both sides before we name exact window titles. Flex data commonly includes ~4%, 15%, and 30% compression.","tabs":[{"label":"CFM","heading":"Airflow scale","color":"green","mark":"cubic feet per minute"},{"label":"Friction","heading":"Friction-rate scale","color":"green","mark":"align with CFM to read size/velocity"},{"label":"Flex %","heading":"Flex compression conditions","color":"pink","mark":"near 4% stretched vs 15% vs 30% bunched"}]}],"ductExercises":[{"id":"du1","kind":"compress","stem":"Use the calculator on this page. Cut length 25 ft, installed 21.25 ft. Which band is that?","choices":["About 4% (near stretched)","15%","30%","50%"],"answer":1,"why":"(25 − 21.25) ÷ 25 = 15%. ADI-style flex data uses ~4% as a stretched baseline and also 15% and 30% bunched conditions.","help":"Plug the two lengths into the calculator above.","explain":["4% would be almost fully pulled out.","Correct. 15%.","30% is more crushed (example: 20 ft cut into 14 ft).","Not these numbers."]},{"id":"du2","kind":"rank","stem":"Same CFM, straight run. Rank expected pressure loss, best (lowest loss) to worst.","choices":["30% → 15% → 4%","4% → 15% → 30%","15% → 4% → 30%","All equal"],"answer":1,"why":"More bunching, more loss. Bends, kinks, and sag can make any of them worse than a straight compressed run.","help":"Stretched is easiest.","explain":["Backwards.","Correct.","15% is not better than 4%.","The path changed."]},{"id":"du3","kind":"concept","stem":"A 30% compressed flex run is loud, the coil is wet, and static is high. First move?","choices":["Leave the bunching and upsize two duct sizes on the wheel","Stretch, support, and remove extra loops, then re-measure TESP and CFM","Add refrigerant","Close the return"],"answer":1,"why":"Physical install first. The wheel cannot bless a coil of leftover flex.","help":"Pull it tight before you buy bigger pipe.","explain":["Defect remains.","Correct.","Airflow is lying to the gauges.","Makes static worse."]},{"id":"du4","kind":"setup","stem":"Guided setup (no fake wheel reading): you know 400 CFM and a design friction rate. You align those two scales to read:","choices":["Duct size and approximate velocity — then look at your physical ADI to confirm","Gas pipe size","Superheat","OSHA reporting hours"],"answer":0,"why":"Classic sizing setup. Exact printed window names wait for photos of your wheel.","help":"CFM + friction → size / velocity.","explain":["Correct. PENDING your wheel photos for the printed words.","IFGC.","Charging.","1904."]},{"id":"du5","kind":"setup","stem":"You know a 8-inch round duct and 400 CFM. The wheel is used to read:","choices":["Friction rate (and you check whether velocity is wild)","IFGC specific gravity","Latent load only","Category IV vent diameter"],"answer":0,"why":"Size + CFM → friction / velocity. PENDING exact ADI window titles.","help":"Two knowns, one unknown on the air wheel.","explain":["Correct.","Gas.","Manual J.","IFGC vents."]},{"id":"du6","kind":"concept","stem":"Percent compression formula?","choices":["Installed ÷ cut × 100","(cut − installed) ÷ cut × 100","(cut − installed) ÷ installed × 100","Compressor discharge psig ÷ suction psig"],"answer":1,"why":"Extra length shoved into a short run is the numerator. Divide by what you cut. Not compressor ratio.","help":"Missing length over cut length.","explain":["That is how much of the duct you used, not compression.","Correct.","Wrong denominator.","Wrong trade meaning of compression."]},{"id":"du7","kind":"concept","stem":"Kinks, sharp bends, and sag on flex:","choices":["Are already included in the 4% stretched number, so ignore them","Add pressure loss on top of whatever compression already exists","Reduce friction because they “slow the air”","Convert the run into a Category I vent"],"answer":1,"why":"Compression % is extra length. Geometry defects are additional. Straighten and support.","help":"Every wrinkle and elbow costs static.","explain":["4% is the stretched baseline, not a free pass for kinks.","Correct.","Backwards.","Wrong system."]},{"id":"du8","kind":"compress","stem":"Cut 40 ft, pull it into 38.4 ft. Band?","choices":["About 4%","15%","30%","This is compressor ratio 10:1"],"answer":0,"why":"(40 − 38.4) ÷ 40 = 4%. That is the near-stretched idea ADI-style flex data uses as a straight, level baseline. Still confirm on your wheel.","help":"1.6 ÷ 40 = 0.04.","explain":["Correct. ~4%.","Would be 34 ft installed.","Would be 28 ft installed.","Wrong meaning of compression."]}],"LOOKUP_SECONDS":90,"HL_LABEL":{"yellow":"Yellow — rule / trigger phrase","green":"Green — formula / table / input","pink":"Pink — exception / safety / deadline"}};</script>
  <script>
    const D = window.DATA;
    const KEY = "ac-shark-study-v3-public";
    const tabs = [
      ["home", "Home"],
      ["library", "Library"],
      ["learn", "Learn"],
      ["practice", "Practice"],
      ["exam", "125 Test"],
    ];
    const tracks = ["electrical", "refrigeration", "code", "exam"];
    const state = load();
    let exam = { running: false, left: D.EXAM_SECONDS, idx: 0, setQ: [], picks: [], result: null };
    let examTimer = null;
    let helpOn = false;

    function load() {
      try { return Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
      catch { return defaults(); }
    }
    function defaults() {
      return {
        view: "home", lessonIndex: 0, qId: D.questions[0].id, pick: null, checked: false,
        answered: 0, correct: 0, doneLessons: [], missed: [], flagged: [],
        practiceFilter: "all", practiceLessonId: null, lastExamRight: null, lastExamTotal: null,
      };
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function letter(i) { return String.fromCharCode(65 + i); }
    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = String(sec % 60).padStart(2, "0");
      return m + ":" + s;
    }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function meter(v, max) {
      const pct = max ? Math.round((v / max) * 100) : 0;
      return '<div class="meter" role="progressbar"><i style="width:' + pct + '%"></i></div>';
    }
    function bank() {
      if (state.practiceLessonId) return D.questions.filter(q => q.lesson === state.practiceLessonId);
      if (state.practiceFilter === "missed") return D.questions.filter(q => state.missed.includes(q.id));
      if (state.practiceFilter === "flagged") return D.questions.filter(q => state.flagged.includes(q.id));
      if (state.practiceFilter === "all") return D.questions;
      return D.questions.filter(q => q.track === state.practiceFilter);
    }

    function renderNav() {
      document.getElementById("desk-nav").innerHTML = tabs.map(([id, label]) =>
        '<button type="button" class="' + (state.view === id ? "on" : "") + '" data-view="' + id + '">' + label + "</button>"
      ).join("");
      document.getElementById("mob-nav").innerHTML = tabs.map(([id, label]) =>
        '<button type="button" class="' + (state.view === id ? "on" : "") + '" data-view="' + id + '">' + (id === "exam" ? "Exam" : label) + "</button>"
      ).join("");
      document.getElementById("side-meta").innerHTML =
        state.doneLessons.length + "/" + D.lessons.length + " lessons<br>" +
        state.answered + " / " + D.questions.length + " practiced";
      document.getElementById("mobile-page").textContent = tabs.find(t => t[0] === state.view)[1];
    }

    function home() {
      const next = D.lessons.find(l => !state.doneLessons.includes(l.id)) || D.lessons[0];
      const pct = state.answered ? Math.round((state.correct / state.answered) * 100) : 0;
      const formulas = D.lessons.filter(l => l.formula);
      return '<div class="space">' +
        '<div><p class="kicker">Texas Class A</p><h1 class="page-h">Sit the 125-question test.</h1>' +
        '<p class="lead">Short lessons, original questions, and a timed drill. Full textbooks stay in Drive or on the table.</p></div>' +
        '<section class="card"><p class="kicker">Continue</p><h2>' + esc(next.title) + "</h2>" +
        '<p class="muted">' + esc(next.lead) + '</p><div class="row" style="margin-top:1rem">' +
        '<button class="btn" data-act="open-lesson" data-i="' + D.lessons.indexOf(next) + '">Open lesson</button>' +
        '<button class="btn sec" data-view="practice">Practice</button>' +
        '<button class="btn" data-act="start-exam">Start 125-question test</button><button class="btn sec" data-view="exam">Exam options</button></div></section>' +
        '<div class="stats">' +
          stat("Lessons", state.doneLessons.length + "/" + D.lessons.length) +
          stat("Accuracy", state.answered ? pct + "%" : "—") +
          stat("Missed", String(state.missed.length)) +
          stat("Last drill", state.lastExamTotal != null ? state.lastExamRight + "/" + state.lastExamTotal : "—") +
        "</div>" +
        "<h2>Tracks</h2><div class=\"tracks\">" + tracks.map(t => {
          const group = D.lessons.filter(l => l.track === t);
          const done = group.filter(l => state.doneLessons.includes(l.id)).length;
          const first = group.find(l => !state.doneLessons.includes(l.id)) || group[0];
          return '<button class="track" data-act="open-lesson" data-i="' + D.lessons.indexOf(first) + '">' +
            "<div style=\"display:flex;justify-content:space-between\"><b>" + D.trackLabel[t] + "</b><span class=\"muted\">" + done + "/" + group.length + "</span></div>" +
            meter(done, group.length) + '<p class="muted" style="margin:.75rem 0 0">' + esc(first.title) + "</p></button>";
        }).join("") + "</div>" +
        '<section class="card"><h2>Formula strip</h2><ul class="list">' +
        formulas.map(l => "<li style=\"display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap\"><span class=\"muted\">" + esc(l.title) + "</span><b>" + esc(l.formula) + "</b></li>").join("") +
        "</ul></section>" +
        '<section class="card"><h2>Exam frame</h2><div class="stats">' +
        stat("Scored items", "120") + stat("Time", "230 min") + stat("Pass mark", "70%") + stat("Code year", "2024") +
        '</div><p class="muted" style="margin-top:1rem">Exams on or after September 1, 2026 use the 2024 UMC, IMC, and IFGC. Questions here are original practice, not PSI items.</p></section></div>';
    }

    function stat(k, v) { return '<div class="stat"><p>' + k + "</p><b>" + v + "</b></div>"; }

    function library() {
      const packets = D.resources.filter(r => r.group === "packet");
      const official = D.resources.filter(r => r.group === "official");
      function list(title, items) {
        return "<h2>" + title + '</h2><div class="res">' + items.map(r =>
          '<a href="' + r.href + '" target="_blank" rel="noopener noreferrer"><div><b>' + esc(r.title) + '</b><div class="muted" style="font-size:.875rem">' + esc(r.note) + "</div></div><span class=\"muted\">Open</span></a>"
        ).join("") + "</div>";
      }
      return '<div class="space"><div><p class="kicker">Library</p><h1 class="page-h">Packets and official pages</h1>' +
        '<p class="lead">Sign into Google if a Drive file asks. This site does not host the full textbooks.</p></div>' +
        list("Study packets", packets) + list("Official pages", official) +
        '<section class="card"><h2>Paper books for the PSI room</h2><p class="muted">Bring only current approved references. Custom packets stay home.</p>' +
        '<ul class="list">' + D.paperBooks.map(b => "<li>" + esc(b) + "</li>").join("") + "</ul></section></div>";
    }

    function learn() {
      const lesson = D.lessons[state.lessonIndex] || D.lessons[0];
      const related = D.questions.filter(q => q.lesson === lesson.id);
      const done = state.doneLessons.includes(lesson.id);
      const sel = '<label class="sm-only">Lesson<select class="lesson-pick" id="lesson-select">' +
        D.lessons.map((l, i) => '<option value="' + i + '"' + (i === state.lessonIndex ? " selected" : "") + ">" +
          (state.doneLessons.includes(l.id) ? "Done · " : "") + esc(l.title) + "</option>").join("") + "</select></label>";
      const syllabus = '<section class="card md-only"><p class="kicker">Syllabus</p><p class="muted">' +
        state.doneLessons.length + " of " + D.lessons.length + " complete</p><div class=\"lesson-list\">" +
        tracks.map(t => "<p class=\"muted\" style=\"font-size:.75rem;margin:1rem 0 .25rem\">" + D.trackLabel[t] + "</p>" +
          D.lessons.filter(l => l.track === t).map(l => {
            const i = D.lessons.indexOf(l);
            return '<button type="button" class="' + (i === state.lessonIndex ? "on" : "") + '" data-act="set-lesson" data-i="' + i + '">' + esc(l.title) + "</button>";
          }).join("")).join("") + "</div></section>";
      const reader = '<article class="card"><p class="kicker">' + (state.lessonIndex + 1) + " / " + D.lessons.length +
        " · " + D.trackLabel[lesson.track] + "</p><h1 class=\"page-h\">" + esc(lesson.title) + "</h1>" +
        '<p class="lead">' + esc(lesson.lead) + "</p>" +
        (lesson.formula ? '<p class="formula">' + esc(lesson.formula) + "</p>" : "") +
        lesson.blocks.map(b => "<section style=\"margin-top:1.25rem\"><h3 style=\"font-size:.9rem;" +
          (b.kind === "safety" ? "color:var(--danger)" : b.kind === "memory" ? "color:var(--accent)" : "") +
          '">' + esc(b.title) + '</h3><p>' + esc(b.body) + "</p></section>").join("") +
        '<p class="muted" style="margin-top:1.5rem">' + esc(lesson.locator) + "</p>" +
        (related.length ? '<div style="margin-top:1.25rem;background:var(--bg);border-radius:1rem;padding:1rem;box-shadow:var(--shadow)"><p><b>Practice this lesson</b></p><ul class="muted">' +
          related.map(q => "<li>" + esc(q.stem) + "</li>").join("") +
          '</ul><button class="btn sec" style="margin-top:.75rem" data-act="practice-lesson" data-id="' + lesson.id + '">Start ' + related.length + " questions</button></div>" : "") +
        '<div class="row" style="margin-top:1.25rem">' +
        '<button class="btn sec" data-act="prev-lesson">Previous</button>' +
        '<button class="btn" data-act="next-lesson">Next lesson</button>' +
        '<button class="btn sec" data-act="toggle-done" data-id="' + lesson.id + '">' + (done ? "Completed" : "Mark complete") + "</button></div></article>";
      return '<div class="split">' + sel + syllabus + reader + "</div>";
    }

    function practice() {
      const b = bank();
      const q = b.find(x => x.id === state.qId) || b[0];
      if (!q) {
        return '<div class="card"><h1>Nothing in this queue</h1><p class="muted">Wrong answers collect here after you check them.</p>' +
          '<button class="btn" data-act="filter" data-id="all">Back to all</button></div>';
      }
      const pos = b.indexOf(q);
      const filters = [
        ["all", "All"],
        ["missed", "Missed " + state.missed.length],
        ["flagged", "Flagged " + state.flagged.length],
        ["electrical", "Electrical"],
        ["refrigeration", "Refrigeration"],
        ["code", "Code"],
        ["exam", "Exam"],
      ];
      const lessonName = state.practiceLessonId ? (D.lessons.find(l => l.id === state.practiceLessonId) || {}).title : "Question bank";
      return '<div class="space"><div style="display:flex;justify-content:space-between;gap:1rem;align-items:flex-end">' +
        "<div><p class=\"kicker\">Practice</p><h1 class=\"page-h\">" + esc(lessonName) + '</h1><p class="muted">' +
        state.correct + " of " + state.answered + " correct · not PSI items</p></div>" +
        '<p class="muted">' + (pos + 1) + " / " + b.length + "</p></div>" +
        '<div class="chips">' + filters.map(([id, label]) =>
          '<button class="chip' + (!state.practiceLessonId && state.practiceFilter === id ? " on" : "") + '" data-act="filter" data-id="' + id + '">' + label + "</button>"
        ).join("") + "</div>" +
        (state.practiceLessonId ? '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>Only questions from this lesson.</span><button class="btn sec" data-act="clear-lesson">Show all</button></div>' : "") +
        '<section class="card"><p class="muted">' + esc(q.skill) + '</p><p style="font-size:1.15rem;font-weight:500">' + esc(q.stem) + "</p>" +
        '<div style="margin-top:1rem;display:grid;gap:.5rem">' + q.choices.map((c, i) => {
          let cls = "choice";
          if (state.checked && i === q.answer) cls += " good";
          else if (state.checked && state.pick === i) cls += " bad";
          else if (state.pick === i) cls += " picked";
          return '<button class="' + cls + '" data-act="pick" data-i="' + i + '"' + (state.checked ? " disabled" : "") + '><span class="ltr">' + letter(i) + "</span><span>" + esc(c) + "</span></button>";
        }).join("") + "</div>" +
        '<div class="row" style="margin-top:1rem">' +
        '<button class="btn sec" data-act="help">Hint</button>' +
        '<button class="btn sec" data-act="study-q" data-id="' + q.lesson + '">Study lesson</button>' +
        (state.checked
          ? '<button class="btn" data-act="next-q">Next</button>'
          : '<button class="btn" data-act="check"' + (state.pick == null ? " disabled" : "") + ">Check</button>") +
        "</div>" +
        (helpOn ? '<p class="muted" style="margin-top:1rem"><b>Hint.</b> ' + esc(q.help) + "</p>" : "") +
        (state.checked ? '<p class="' + (state.pick === q.answer ? "ok" : "no") + '" style="margin-top:1rem"><b>' +
          (state.pick === q.answer ? "Correct. " : "Not yet. ") + "</b>" + esc(q.why) + "</p>" : "") +
        "</section></div>";
    }

    function examView() {
      if (!exam.running && !exam.result) {
        return '<div class="space"><div><p class="kicker">Exam Lab</p><h1 class="page-h">125-question test</h1>' +
          '<p class="lead">' + D.EXAM_COUNT + " original questions. " + (D.EXAM_SECONDS / 60) + " minutes. No hints while the clock runs.</p></div>" +
          '<section class="card"><div class="stats">' +
          stat("Items", String(D.EXAM_COUNT)) + stat("Clock", (D.EXAM_SECONDS / 60) + " min") +
          stat("Last run", state.lastExamTotal != null ? state.lastExamRight + "/" + state.lastExamTotal : "—") +
          '</div><ul class="muted"><li>Tap an item number to jump.</li><li>70% is the real exam pass mark. This drill is practice only.</li></ul>' +
          '<button class="btn" style="margin-top:1.25rem" data-act="start-exam">Start 125-question test</button></section></div>';
      }
      if (exam.result && !exam.running) {
        const pct = Math.round((exam.result.right / exam.result.total) * 100);
        return '<div class="space"><p class="kicker">Exam Lab</p><h1 class="page-h">Drill complete</h1>' +
          '<section class="card"><h2>' + exam.result.right + " / " + exam.result.total + '</h2><p class="muted">' +
          pct + "% on this drill. Real exam pass mark is 70%.</p></section>" +
          '<div class="res">' + exam.setQ.map((item, i) => {
            const ok = exam.picks[i] === item.answer;
            return "<div style=\"padding:1rem 1.25rem;border-bottom:1px solid #2a3140\"><div style=\"display:flex;justify-content:space-between;gap:.5rem\"><b>" +
              esc(item.stem) + "</b><span class=\"muted\">" + (ok ? "Correct" : "Missed") + "</span></div>" +
              '<p class="muted">' + esc(item.why) + "</p></div>";
          }).join("") + "</div>" +
          '<button class="btn" data-act="start-exam">Run again</button></div>';
      }
      const q = exam.setQ[exam.idx];
      const answered = exam.picks.filter(p => p != null).length;
      return '<div class="space"><div style="display:flex;justify-content:space-between;align-items:flex-end">' +
        '<div><p class="kicker">Exam Lab</p><p class="timer">' + fmt(exam.left) + "</p></div>" +
        '<p class="muted">' + answered + " / " + exam.setQ.length + " answered</p></div>" +
        meter(answered, exam.setQ.length) +
        '<div class="pills">' + exam.setQ.map((_, i) =>
          '<button class="' + (i === exam.idx ? "on" : exam.picks[i] != null ? "mark" : "") + '" data-act="exam-idx" data-i="' + i + '">' + (i + 1) + "</button>"
        ).join("") + "</div>" +
        '<section class="card"><p class="muted">Item ' + (exam.idx + 1) + " · " + esc(q.skill) + '</p>' +
        '<p style="font-size:1.15rem;font-weight:500">' + esc(q.stem) + "</p>" +
        '<div style="margin-top:1rem;display:grid;gap:.5rem">' + q.choices.map((c, i) =>
          '<button class="choice' + (exam.picks[exam.idx] === i ? " picked" : "") + '" data-act="exam-pick" data-i="' + i + '"><span class="ltr">' + letter(i) + "</span><span>" + esc(c) + "</span></button>"
        ).join("") + "</div>" +
        '<div class="row" style="margin-top:1rem">' +
        '<button class="btn sec" data-act="exam-back"' + (exam.idx === 0 ? " disabled" : "") + ">Back</button>" +
        '<button class="btn" data-act="exam-next">' + (exam.idx >= exam.setQ.length - 1 ? "Finish" : "Next") + "</button>" +
        '<button class="btn sec" data-act="exam-stop">Stop and score</button></div></section></div>';
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&" + "amp;")
        .replace(/</g, "&" + "lt;")
        .replace(/>/g, "&" + "gt;")
        .replace(/"/g, "&" + "quot;");
    }

    function render() {
      renderNav();
      const root = document.getElementById("root");
      root.innerHTML = state.view === "library" ? library()
        : state.view === "learn" ? learn()
        : state.view === "practice" ? practice()
        : state.view === "exam" ? examView()
        : home();
    }

    function finishExam() {
      exam.running = false;
      if (examTimer) { clearInterval(examTimer); examTimer = null; }
      const right = exam.setQ.filter((q, i) => exam.picks[i] === q.answer).length;
      exam.result = { right, total: exam.setQ.length };
      state.lastExamRight = right;
      state.lastExamTotal = exam.setQ.length;
      save();
      render();
    }

    function startExam() {
      state.view = "exam";
      exam.setQ = shuffle(D.questions).slice(0, D.EXAM_COUNT);
      exam.picks = Array(exam.setQ.length).fill(null);
      exam.idx = 0;
      exam.left = D.EXAM_SECONDS;
      exam.result = null;
      exam.running = true;
      if (examTimer) clearInterval(examTimer);
      examTimer = setInterval(() => {
        exam.left = Math.max(0, exam.left - 1);
        if (exam.left === 0) finishExam();
        else if (state.view === "exam") render();
      }, 1000);
      render();
    }

    document.addEventListener("click", (e) => {
      const t = e.target.closest("[data-view], [data-act]");
      if (!t) return;
      if (t.dataset.view) { state.view = t.dataset.view; save(); render(); return; }
      const act = t.dataset.act;
      if (act === "open-lesson") {
        state.lessonIndex = Number(t.dataset.i); state.view = "learn"; save(); render();
      } else if (act === "set-lesson") {
        state.lessonIndex = Number(t.dataset.i); save(); render();
      } else if (act === "prev-lesson") {
        state.lessonIndex = (state.lessonIndex + D.lessons.length - 1) % D.lessons.length; save(); render();
      } else if (act === "next-lesson") {
        const cur = D.lessons[state.lessonIndex];
        if (cur && !state.doneLessons.includes(cur.id)) state.doneLessons.push(cur.id);
        state.lessonIndex = (state.lessonIndex + 1) % D.lessons.length; save(); render();
      } else if (act === "toggle-done") {
        const id = t.dataset.id;
        state.doneLessons = state.doneLessons.includes(id) ? state.doneLessons.filter(x => x !== id) : state.doneLessons.concat(id);
        save(); render();
      } else if (act === "practice-lesson") {
        const related = D.questions.filter(q => q.lesson === t.dataset.id);
        state.practiceLessonId = t.dataset.id;
        state.qId = related[0] ? related[0].id : state.qId;
        state.pick = null; state.checked = false; helpOn = false;
        state.view = "practice"; save(); render();
      } else if (act === "filter") {
        state.practiceFilter = t.dataset.id; state.practiceLessonId = null;
        state.pick = null; state.checked = false; helpOn = false; save(); render();
      } else if (act === "clear-lesson") {
        state.practiceLessonId = null; save(); render();
      } else if (act === "pick") {
        if (!state.checked) { state.pick = Number(t.dataset.i); save(); render(); }
      } else if (act === "check") {
        const bnk = bank();
        const q = bnk.find(x => x.id === state.qId) || bnk[0];
        if (!q || state.pick == null || state.checked) return;
        const ok = state.pick === q.answer;
        state.checked = true; state.answered += 1; if (ok) state.correct += 1;
        if (ok) state.missed = state.missed.filter(id => id !== q.id);
        else if (!state.missed.includes(q.id)) state.missed.push(q.id);
        save(); render();
      } else if (act === "next-q") {
        const bnk = bank();
        const q = bnk.find(x => x.id === state.qId) || bnk[0];
        const pos = bnk.indexOf(q);
        const next = bnk[(pos + 1) % bnk.length];
        if (next) { state.qId = next.id; state.pick = null; state.checked = false; helpOn = false; save(); render(); }
      } else if (act === "help") {
        helpOn = true; render();
      } else if (act === "study-q") {
        state.lessonIndex = D.lessons.findIndex(l => l.id === t.dataset.id);
        if (state.lessonIndex < 0) state.lessonIndex = 0;
        state.view = "learn"; save(); render();
      } else if (act === "start-exam") {
        startExam();
      } else if (act === "exam-idx") {
        exam.idx = Number(t.dataset.i); render();
      } else if (act === "exam-pick") {
        exam.picks[exam.idx] = Number(t.dataset.i); render();
      } else if (act === "exam-back") {
        exam.idx = Math.max(0, exam.idx - 1); render();
      } else if (act === "exam-next") {
        if (exam.idx >= exam.setQ.length - 1) finishExam();
        else { exam.idx += 1; render(); }
      } else if (act === "exam-stop") {
        finishExam();
      }
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "lesson-select") {
        state.lessonIndex = Number(e.target.value); save(); render();
      }
    });
    render();
  </script>
</body>
