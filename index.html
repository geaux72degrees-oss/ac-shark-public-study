<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AC SHARK Study</title>
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="Texas Environmental Air Class A study: lessons, original practice, and a 125-question test." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d10;
      --ink: #e8edf5;
      --card: #141820;
      --muted: #1c222c;
      --muted-fg: #9aa3b2;
      --accent: #6ea8ff;
      --accent-fg: #071018;
      --success: #3dba8b;
      --danger: #f07167;
      --sidebar: #08090c;
      --sidebar-fg: #e8edf5;
      --sidebar-muted: #8b93a1;
      --shadow: 0 0 0 1px #2a3140;
      --sans: "Outfit", "Segoe UI", system-ui, sans-serif;
      --display: "Syne", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100dvh;
    }
    h1, h2, h3 { font-family: var(--display); letter-spacing: -.03em; text-wrap: balance; font-weight: 600; }
    p { text-wrap: pretty; }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }
    .app { min-height: 100dvh; }
    @media (min-width: 768px) { .app { display: flex; } }
    .sidebar {
      display: none;
      width: 15rem;
      background: var(--sidebar);
      color: var(--sidebar-fg);
      padding: 1.5rem 1rem;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100dvh;
    }
    @media (min-width: 768px) { .sidebar { display: flex; } }
    .brand { display: flex; gap: .75rem; align-items: center; padding: 0 .5rem; }
    .mark {
      width: 2rem; height: 2rem; border-radius: .5rem; background: var(--accent);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .mark svg { width: 1.25rem; height: 1.25rem; }
    .nav { margin-top: 2rem; display: flex; flex-direction: column; gap: .25rem; flex: 1; }
    .nav button {
      min-height: 2.75rem; border: 0; border-radius: .5rem; padding: 0 .75rem;
      background: transparent; color: var(--sidebar-muted); text-align: left; font-size: .875rem; font-weight: 500;
    }
    .nav button.on { background: var(--accent); color: var(--accent-fg); }
    .side-meta { padding: 0 .75rem; font-size: .75rem; color: var(--sidebar-muted); }
    .main-wrap {
      flex: 1; min-width: 0;
      padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
    }
    @media (min-width: 768px) { .main-wrap { padding-bottom: 0; } }
    .topbar {
      display: flex; gap: .75rem; align-items: center;
      padding: .75rem 1rem; padding-top: max(.75rem, env(safe-area-inset-top));
      border-bottom: 1px solid #2a3140; background: rgba(11,13,16,.9);
      position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px);
    }
    @media (min-width: 768px) { .topbar { display: none; } }
    .content { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1rem; }
    @media (min-width: 768px) { .content { padding: 2rem; } }
    .card { background: var(--card); border-radius: 1.75rem; padding: 1.25rem; box-shadow: var(--shadow); }
    @media (min-width: 768px) { .card { padding: 1.5rem; } }
    .kicker { font-size: .75rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0; }
    .page-h { margin: .25rem 0 0; font-size: 1.875rem; }
    .lead { color: var(--muted-fg); line-height: 1.5; max-width: 40rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; }
    .btn {
      min-height: 2.75rem; border: 0; border-radius: .5rem; padding: 0 1rem;
      font-size: .875rem; font-weight: 500; background: var(--ink); color: var(--card);
    }
    .btn.sec { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
    .btn:disabled { opacity: .5; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    @media (min-width: 768px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    .stat { background: var(--card); border-radius: 1.25rem; padding: .75rem 1rem; box-shadow: var(--shadow); }
    .stat p { margin: 0; font-size: .75rem; color: var(--muted-fg); }
    .stat b { display: block; margin-top: .25rem; font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .tracks { display: grid; gap: .75rem; }
    @media (min-width: 640px) { .tracks { grid-template-columns: 1fr 1fr; } }
    .track {
      text-align: left; background: var(--card); border: 0; border-radius: 1.75rem;
      padding: 1.25rem; box-shadow: var(--shadow); font: inherit; color: inherit;
    }
    .meter { height: .375rem; background: var(--muted); border-radius: 999px; overflow: hidden; }
    .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
    .split { display: grid; gap: 1rem; }
    @media (min-width: 768px) { .split { grid-template-columns: 1fr 2fr; align-items: start; } }
    .lesson-list { max-height: 24rem; overflow: auto; }
    .lesson-list button {
      display: block; width: 100%; text-align: left; min-height: 2.5rem;
      border: 0; border-radius: .5rem; padding: .4rem .5rem; background: transparent; font-size: .875rem;
    }
    .lesson-list button.on { background: var(--ink); color: var(--card); }
    .choice {
      display: flex; gap: .75rem; align-items: flex-start; width: 100%;
      min-height: 3rem; text-align: left; border: 0; border-radius: .75rem;
      padding: .75rem; background: var(--muted); box-shadow: var(--shadow); font: inherit;
    }
    .choice .ltr {
      width: 2rem; height: 2rem; border-radius: 999px; display: grid; place-items: center;
      font-size: .75rem; font-weight: 500; background: var(--card); box-shadow: var(--shadow); flex-shrink: 0;
    }
    .choice.picked { background: var(--muted); }
    .choice.picked .ltr { background: var(--ink); color: var(--card); }
    .choice.good { background: rgba(44,107,74,.12); }
    .choice.good .ltr { background: var(--success); color: #fff; }
    .choice.bad { background: rgba(166,31,26,.12); }
    .choice.bad .ltr { background: var(--danger); color: #fff; }
    .chips { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; }
    .chip {
      height: 2.5rem; border: 0; border-radius: 999px; padding: 0 .75rem; white-space: nowrap;
      background: var(--card); color: var(--muted-fg); box-shadow: var(--shadow); font-size: .875rem; font-weight: 500;
    }
    .chip.on { background: var(--ink); color: var(--card); }
    .formula { background: var(--bg); border-radius: .75rem; padding: .75rem 1rem; box-shadow: var(--shadow); font-family: var(--display); font-size: 1.25rem; }
    .bottom {
      position: fixed; inset: auto 0 0 0; display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--card); border-top: 1px solid #2a3140;
      padding-bottom: env(safe-area-inset-bottom); z-index: 20;
    }
    @media (min-width: 768px) { .bottom { display: none; } }
    .bottom button {
      min-height: 3.5rem; border: 0; background: transparent; color: var(--muted-fg);
      font-size: .7rem; font-weight: 500;
    }
    .bottom button.on { color: var(--accent); }
    .res a {
      display: flex; justify-content: space-between; gap: .75rem; align-items: center;
      padding: 1rem 1.25rem; border-bottom: 1px solid #2a3140; text-decoration: none;
    }
    .res { background: var(--card); border-radius: 1.75rem; overflow: hidden; box-shadow: var(--shadow); }
    .res a:last-child { border-bottom: 0; }
    .muted { color: var(--muted-fg); }
    .ok { background: rgba(44,107,74,.12); padding: 1rem; border-radius: .75rem; }
    .no { background: rgba(166,31,26,.12); padding: 1rem; border-radius: .75rem; }
    .pills { display: flex; flex-wrap: wrap; gap: .35rem; }
    .pills button {
      width: 2.25rem; height: 2.25rem; border: 0; border-radius: .5rem;
      background: var(--card); box-shadow: var(--shadow); font-size: .75rem; font-variant-numeric: tabular-nums;
    }
    .pills button.on { background: var(--ink); color: var(--card); }
    .pills button.mark { background: var(--muted); }
    .md-only { display: none; }
    @media (min-width: 768px) { .md-only { display: block; } .sm-only { display: none !important; } }
    select.lesson-pick {
      width: 100%; height: 3rem; border: 0; border-radius: .5rem; padding: 0 .75rem;
      background: var(--card); box-shadow: var(--shadow); font: inherit;
    }
    .timer { font-family: var(--display); font-size: 1.875rem; color: var(--accent); font-variant-numeric: tabular-nums; margin: 0; }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { padding: .75rem 0; border-bottom: 1px solid #2a3140; }
    .list li:last-child { border-bottom: 0; }
    .space > * + * { margin-top: 1.25rem; }
  </style>
</head>

  <script>window.DATA = {"lessons":[{"id":"ohms","track":"electrical","domain":"service","title":"Calculate current with Ohm’s law","lead":"Find current from voltage and resistance on the same circuit path.","formula":"I = E ÷ R","blocks":[{"kind":"note","title":"Plain English","body":"Current is flow. Voltage is the push. Resistance is the squeeze. Divide the push by the squeeze."},{"kind":"note","title":"Technician words","body":"I is amperes. E is volts. R is ohms. Stay on one path. Do not mix series and parallel values."},{"kind":"memory","title":"Remember","body":"Cover I in the Ohm’s law triangle. What is left is E over R."},{"kind":"note","title":"Worked example","body":"A 240 V heater circuit measures 60 Ω. I = 240 ÷ 60 = 4 A."},{"kind":"safety","title":"Safety","body":"This is math and recognition only. It does not tell you to work on live equipment."}],"locator":"Modern Refrigeration — electrical fundamentals / Ohm’s law. Open the book map in Library."},{"id":"power","track":"electrical","domain":"service","title":"Calculate true power","lead":"Find watts from current and voltage on a resistive load.","formula":"P = I × E","blocks":[{"kind":"note","title":"Plain English","body":"Power is how hard the circuit is working. Multiply flow by push."},{"kind":"note","title":"Technician words","body":"P is watts. 1,000 W = 1 kW. On a resistive heater, true power is volts times amps."},{"kind":"note","title":"Worked example","body":"10 A at 240 V. P = 10 × 240 = 2,400 W = 2.4 kW."},{"kind":"memory","title":"Units","body":"Move three places: 1.5 kW = 1,500 W. 3,600 W = 3.6 kW."},{"kind":"safety","title":"Safety","body":"Math only. Do not treat this page as a live-work procedure."}],"locator":"Modern Refrigeration — electrical power and loads."},{"id":"cycle","track":"refrigeration","domain":"components","title":"The vapor-compression cycle","lead":"Four jobs, in order: absorb heat, raise pressure, reject heat, drop pressure.","blocks":[{"kind":"note","title":"Order","body":"Evaporator → compressor → condenser → metering device → back to the evaporator."},{"kind":"note","title":"What each part does","body":"Evaporator absorbs heat and boils liquid to vapor. Compressor takes low-pressure vapor and discharges high-pressure vapor. Condenser rejects heat and condenses vapor to liquid. The metering device drops pressure so the liquid can boil again."},{"kind":"memory","title":"Vapor in, vapor out","body":"The compressor is a vapor pump. Liquid in the compressor is a failure mode, not a design intent."},{"kind":"safety","title":"Safety","body":"Concept lesson only. Recover refrigerant before opening a system."}],"locator":"Modern Refrigeration — refrigeration cycle / four major components."},{"id":"sh","track":"refrigeration","domain":"service","title":"Superheat","lead":"Superheat is how much hotter the vapor is than its saturation temperature.","formula":"SH = actual vapor °F − saturation °F","blocks":[{"kind":"note","title":"Plain English","body":"After all liquid has boiled, leftover heat in the vapor is superheat."},{"kind":"note","title":"Field meaning","body":"Measure suction-line temperature and compare it with evaporator saturation from the low-side pressure. Low superheat can mean overfeed. High superheat can mean a starved coil."},{"kind":"memory","title":"Where you read it","body":"Superheat lives on the low side / suction line. Subcooling lives on the high side / liquid line."},{"kind":"safety","title":"Safety","body":"Use rated gauges and PPE. This is a concept lesson, not a charging procedure."}],"locator":"Modern Refrigeration — superheat / evaporator feed. Confirm the heading in your 22e book."},{"id":"sc","track":"refrigeration","domain":"service","title":"Subcooling","lead":"Subcooling is how much cooler the liquid is than its saturation temperature.","formula":"SC = saturation °F − actual liquid °F","blocks":[{"kind":"note","title":"Plain English","body":"After vapor has condensed, leftover cooling of the liquid is subcooling."},{"kind":"note","title":"Field meaning","body":"Measure liquid-line temperature and compare it with condenser saturation from the high-side pressure. Subcooling helps confirm liquid at the metering device."},{"kind":"note","title":"Charge clues","body":"Low subcooling often tracks with undercharge. High subcooling can track with overcharge. Confirm with the whole picture, not one number."},{"kind":"safety","title":"Safety","body":"Concept only. Do not treat this page as a charging chart."}],"locator":"Modern Refrigeration — subcooling / condenser and liquid line."},{"id":"a2l","track":"refrigeration","domain":"components","title":"A2L mildly flammable refrigerants","lead":"A2L is a safety class, not a brand. Treat tools, leak checks, and charge limits as rated work.","blocks":[{"kind":"note","title":"What A2L means","body":"ASHRAE 34 class A2L means lower toxicity and mild flammability. It is not the same as older A1 “practically nonflammable” service habits."},{"kind":"note","title":"Field habits","body":"Use equipment and leak detection rated for the refrigerant. Follow the manufacturer charge limit. Ventilation and ignition-source rules matter more than they did on many A1 jobs."},{"kind":"memory","title":"Do not mix","body":"Do not drop an A2L charge into a system built and labeled for a different safety class. Look up the nameplate and the service literature."},{"kind":"safety","title":"Safety","body":"Flammability is mild, not zero. No open flame, no smoking, no unrated electrical spark sources in a leaked cloud."}],"locator":"A2L + Formula Tools in Library. Modern Refrigeration — refrigerant safety classes. Equipment nameplate."},{"id":"vac","track":"refrigeration","domain":"service","title":"Recovery, evacuate, and vacuum","lead":"Take the refrigerant out. Then pull air and moisture out. Those are two different jobs.","blocks":[{"kind":"note","title":"Recovery","body":"Move refrigerant from the system into a recovery cylinder before you open the circuit. Recovery is not reclaim. Reclaim is reprocessing to a purity standard."},{"kind":"note","title":"Evacuate","body":"A vacuum pump pulls noncondensable gas and moisture. A micron gauge on the system tells you what the system is doing, not what the pump is doing."},{"kind":"memory","title":"Hold test","body":"A standing vacuum that rises fast usually means a leak or leftover moisture. Isolate the pump and watch the gauge."},{"kind":"safety","title":"Safety","body":"Use rated cylinders. Do not mix recovered refrigerants. Follow EPA 608 rules on venting."}],"locator":"Modern Refrigeration — recovery, evacuation, and charging. EPA 608 is a separate credential."},{"id":"condensate","track":"code","domain":"piping","title":"Condensate disposal","lead":"Cooling coils make water. The code cares where that water goes and what happens if the drain fails.","blocks":[{"kind":"note","title":"What to look up","body":"In the 2024 IMC and UMC, find condensate disposal: slope, trap, materials, and termination. Do not guess a number in the PSI room. Find the heading."},{"kind":"note","title":"Failure path","body":"Where overflow would damage the building, expect a secondary drain, an auxiliary pan, or an approved automatic shutoff. That idea is the exam skill. The exact sentence is in the book."},{"kind":"memory","title":"Termination","body":"Do not dump condensate onto a walkway, street, or alley as a nuisance. Confirm allowed termination in the current book."},{"kind":"safety","title":"Honesty","body":"This lesson teaches where to look. It is not a reprint of the code table."}],"locator":"2024 IMC condensate disposal. 2024 UMC condensate equivalent. Inspection Memory Guide in Library."},{"id":"gas","track":"code","domain":"piping","title":"Fuel gas piping basics","lead":"Gas questions live in the IFGC, not in a mechanical-only habit.","blocks":[{"kind":"note","title":"Which book","body":"Pipe sizing, shutoffs, sediment traps, CSST, and appliance connectors are fuel-gas work. Open the 2024 IFGC. The mechanical book will not save a gas-sizing question."},{"kind":"note","title":"Field pattern","body":"Expect an accessible shutoff, a sediment trap where the IFGC requires one, and bonding/grounding rules for CSST. Confirm each in the current book. Do not run gas pipe by “what the last job did.”"},{"kind":"memory","title":"Stem words","body":"If the stem says gas, CSST, sediment trap, or BTU load of an appliance, pick up the IFGC first."},{"kind":"safety","title":"Safety","body":"Fuel gas leaks are an emergency. This page is exam navigation, not a lighting procedure."}],"locator":"2024 IFGC — gas piping and appliance connections. 2024 Code Lookup Pack in Library."},{"id":"vent","track":"code","domain":"venting","title":"Venting categories","lead":"The appliance category tells you draft, pressure, and what kind of vent it can use.","blocks":[{"kind":"note","title":"Categories in one line","body":"Category I is typically negative or neutral draft, non-condensing. Category IV is positive-pressure, condensing, and needs a listed vent system made for that appliance."},{"kind":"note","title":"What to look up","body":"Termination clearances, slope, support, and whether two appliances may share a vent are in the 2024 IFGC. Condensing appliances also make liquid that has to go somewhere."},{"kind":"memory","title":"Do not mix","body":"Do not treat a Category IV plastic vent like a Category I masonry chimney job. The book, the listing, and the nameplate win."},{"kind":"safety","title":"Safety","body":"Wrong venting is a carbon monoxide problem. Look it up. Do not invent a vent path."}],"locator":"2024 IFGC — chimneys and vents. Inspection Memory Guide in Library."},{"id":"ducts","track":"code","domain":"air-distribution","fromMemory":true,"title":"Ducts, return air, and sizing","lead":"Air has to get back to the blower, and the duct has to be sized and installed as listed.","blocks":[{"kind":"note","title":"Sizing tool","body":"The ADI duct calculator is on the approved PSI reference list. Practice using it at home so the wheel is not new in the room."},{"kind":"note","title":"Install habits the books test","body":"Stretch flex duct. Support it. Seal joints. Keep return air out of a garage. Insulation on cooling ducts in unconditioned space — look up the current mechanical-code heading, do not invent R-values."},{"kind":"memory","title":"Return path","body":"If the blower cannot get air back, static rises and capacity falls. A closed-room supply with no return is a comfort and code problem."},{"kind":"safety","title":"Safety","body":"Combustion appliances need their own air. Do not starve a furnace for the sake of a tight return."}],"locator":"2024 IMC/UMC duct chapters. ADI Duct Size Calculator. Modern Refrigeration — air distribution."},{"id":"law","track":"code","domain":"texas-law","fromMemory":true,"title":"Texas ACR law in plain words","lead":"The exam can ask who may contract, advertise, and pull the work — not just how to size a drain.","blocks":[{"kind":"note","title":"Public rules","body":"Texas Occupations Code Chapter 1302 and 16 TAC Chapter 75 are public law. Contracting air conditioning and refrigeration without the right license is the core prohibition."},{"kind":"note","title":"Class A frame","body":"Environmental Air Class A is the license this site studies for. Scope, advertising, and supervisor rules are in 1302 and the TDLR rules. Read those headings in the paper books. Do not rely on a forum summary."},{"kind":"memory","title":"Ads","body":"If you advertise the trade, the law expects a license behind the ad. Look up the exact advertising language in Chapter 1302."},{"kind":"safety","title":"Honesty","body":"This is not legal advice. It is a study map to the public statutes you may bring into the room."}],"locator":"Texas Occupations Code Chapter 1302. 16 TAC Chapter 75. TDLR exam page in Library."},{"id":"lookup","track":"exam","title":"Open-book lookup method","lead":"You will not memorize the UMC. You will find the heading before the clock eats you.","blocks":[{"kind":"note","title":"Read the stem for the book","body":"Gas, CSST, vents → IFGC. Condensate, ducts, mechanical rooms → IMC or UMC. Refrigeration theory, motors, cycle → Modern Refrigeration. Texas contracting → 1302 / TAC 75."},{"kind":"note","title":"Tabs","body":"Permanent commercial tabs are allowed. Custom packets stay home. Tab the table of contents, indexes, and the chapters you actually use."},{"kind":"memory","title":"Two-minute rule","body":"If you cannot see the heading in two minutes, mark the item, move, and come back. Open book still has a clock."},{"kind":"safety","title":"Honesty","body":"Questions on this site are original practice. They are not PSI exam items."}],"locator":"PSI Practice Desk Pack and 2024 Code Lookup Pack in Library. Official PSI bulletin."},{"id":"exam","track":"exam","title":"How the open-book exam works","lead":"Texas Environmental Air Class A: 120 scored items, 230 minutes, 70% to pass.","blocks":[{"kind":"note","title":"Current frame","body":"Five extra non-scored items add 10 minutes. Exams on or after September 1, 2026 use the 2024 UMC, IMC, and IFGC."},{"kind":"note","title":"What to bring","body":"Bring only the current approved references. Permanent commercial tabs are allowed. Custom packets stay home."},{"kind":"memory","title":"Practice that pays","body":"Open book still has a clock. Practice finding the heading fast, not memorizing every table with no book."},{"kind":"safety","title":"Honesty","body":"Questions on this site are original practice. They are not PSI exam items."}],"locator":"Open the PSI bulletin and TDLR exam page from Library."},{"id":"flex","track":"code","domain":"air-distribution","fromMemory":true,"title":"Flexible-duct compression","lead":"Compression here means bunched, sagging, or not-pulled-tight flex — not compressor ratio.","formula":"Compression % = (cut length − installed length) ÷ cut length × 100","blocks":[{"kind":"note","title":"Plain English","body":"If you cut 25 feet of flex and shove it into 21.25 feet of run, that is 15% compression. The liner is wrinkled. Air sees a smaller, rougher path."},{"kind":"note","title":"What the ADI family teaches","body":"Permitted ADI flex data treats near-stretched duct at about 4% compression as the straight, level baseline, and also shows 15% and 30% compression. Kinks, tight bends, and sag add still more pressure loss. Confirm the printed scales on your exact wheel before you trust a number in the room."},{"kind":"memory","title":"Fix the run first","body":"A crushed or coiled flex run is not a sizing problem until it is stretched, supported, and installed as listed. Upsizing a wrinkled duct leaves the install defect in place."},{"kind":"safety","title":"Honesty","body":"Exact wheel readings stay pending until photos of both sides of your ADI calculator are checked. The math on this page does not reprint ADI tables."}],"locator":"ADI Duct Size Calculator (your wheel). 2024 IMC/UMC flexible-duct installation headings. PENDING VERIFICATION: exact scale markings on your wheel."},{"id":"static","track":"code","domain":"air-distribution","fromMemory":true,"title":"Static pressure and air balancing","lead":"Total external static pressure is the extra work the blower sees outside the cabinet.","formula":"TESP ≈ supply static + return static (same units, typically in. w.c.)","blocks":[{"kind":"note","title":"Plain English","body":"Static pressure is air “pushing on the walls” of the duct. Too much static and the blower cannot move the cubic feet per minute (CFM) the coil and furnace were selected for."},{"kind":"note","title":"Where you measure","body":"Typical field pattern: a pressure tap in the supply plenum and one in the return, with filters and coils in their normal place. Compare the total to the equipment nameplate external static rating — look up the manufacturer’s method, do not invent tap locations."},{"kind":"memory","title":"Balance is a system, not a vent","body":"Closing supply registers to “force” another room often raises static and dumps air out of the easiest leaks. Balancing dampers and return paths belong in the design, not as a last-minute squeeze."},{"kind":"safety","title":"Honesty","body":"Nameplate static and test-hole details are in the installation literature. PENDING VERIFICATION against your books."}],"locator":"Modern Refrigeration — air distribution / fans. 2024 IMC/UMC duct and air-distribution headings. Equipment nameplate."},{"id":"filters","track":"code","domain":"air-distribution","fromMemory":true,"title":"Filters and duct construction","lead":"A filter that is too tight, too dirty, or in the wrong place is a static-pressure problem wearing a different hat.","blocks":[{"kind":"note","title":"Filter location","body":"Filters belong in the return path where the listing and code allow them to be serviced. Do not starve the blower with a high-pressure drop media the equipment was not selected for."},{"kind":"note","title":"Duct construction","body":"Joints get sealed. Flex gets stretched and supported. Metal is joined as listed. Return air is not pulled from a garage. Insulation on cooling ducts in unconditioned space is a mechanical-code lookup — do not invent an R-value."},{"kind":"memory","title":"Exam trigger words","body":"Garage return, unlisted tape, compressed flex, and a clogged filter raising static are all air-distribution items, not a refrigerant-charge story."},{"kind":"safety","title":"Safety","body":"Combustion appliances still need their own air. A tight return cannot steal a furnace’s oxygen."}],"locator":"2024 IMC/UMC ducts, return air, and insulation headings. Modern Refrigeration — filters and airflow."},{"id":"wheel","track":"code","domain":"air-distribution","pending":true,"title":"How to use the ADI duct calculator","lead":"The wheel is a permitted exam tool. Practice it at the kitchen table so the scales are not new in the PSI room.","blocks":[{"kind":"note","title":"Learn the scales","body":"Typical ADI-style scales include airflow in cubic feet per minute (CFM), duct size, velocity, friction rate, and pressure loss. Your exact markings are what matter. Photograph both sides later so this lesson can name the printed words on your wheel."},{"kind":"note","title":"Guided setup","body":"A common job: you know the CFM and a design friction rate. You align those and read size and velocity. Another job: you know size and CFM and you read friction. Do not mix round and rectangular windows."},{"kind":"note","title":"Friction and length","body":"Pressure loss ≈ friction rate × effective length. Design friction rate ≈ available static ÷ total effective length. Confirm units on the wheel and in Manual D before you treat this as a finished number."},{"kind":"memory","title":"Real-tool mode","body":"On this site the Wheel lab gives job data. You turn the physical calculator and enter what you read. Auto-grade of exact size stays pending until your wheel photos are in."},{"kind":"safety","title":"Honesty","body":"PENDING VERIFICATION: front and back of your exact ADI calculator. This page does not reprint the manufacturer’s table."}],"locator":"ADI Duct Size Calculator — Air Distribution Institute. ACCA Manual D for residential duct design method. PENDING VERIFICATION: your wheel photos."},{"id":"loads","track":"exam","domain":"equipment-design","pending":true,"title":"Load and equipment selection map","lead":"Manual J sizes the load. Manual S matches equipment to that load. Manual D ducts the air. They are three different jobs.","blocks":[{"kind":"note","title":"Which book","body":"Sensible and latent capacities, heat loads, and equipment selection live in the ACCA manuals on the PSI list — not in a rule of thumb from a supply house."},{"kind":"note","title":"Words you will see","body":"Sensible heat is the temperature change you feel. Latent heat is moisture. Oversizing that ignores latent load can cool the room and still leave it clammy."},{"kind":"memory","title":"Voltage is a design item too","body":"Nameplate voltage, circuit ampacity, and breaker sizing can show up under equipment requirements. Open the nameplate and the electrical chapter — not the condensate table."},{"kind":"safety","title":"Honesty","body":"PENDING VERIFICATION: whether you physically own Manual D, Manual J 8th ed. v2.50, and Manual S 2014. Until then, this lesson is a map, not a page-by-page drill."}],"locator":"ACCA Manual J, Manual S, Manual D as listed on the current PSI bulletin. Equipment nameplate. 2024 mechanical-code equipment headings."},{"id":"combustion","track":"code","domain":"combustion-air","fromMemory":true,"title":"Combustion air","lead":"Fuel-burning appliances need air to burn and a path for dilution. Starving them is a carbon monoxide problem.","blocks":[{"kind":"note","title":"Which book","body":"Combustion air for gas appliances is an International Fuel Gas Code (IFGC) lookup, with mechanical-code overlap on indoor air. Do not answer it from Modern Refrigeration."},{"kind":"note","title":"What to look up","body":"Standard vs known-tight construction, indoor volume, openings to the outdoors, and ducts that bring combustion air in are table-and-section work. Find the heading. Do not invent a square-inch rule from memory."},{"kind":"memory","title":"Confined space trigger","body":"If the stem talks about a small mechanical room, a tight house, or two openings high and low, you are in combustion air — not in dryer exhaust."},{"kind":"safety","title":"Safety","body":"Wrong combustion air is a life-safety miss. Look it up. Do not “make it work” with a louver you did not size."}],"locator":"2024 IFGC — air for combustion and ventilation. Confirm the exact section title in your book. PENDING VERIFICATION: page number."},{"id":"dryer","track":"code","domain":"venting","fromMemory":true,"title":"Dryer exhaust","lead":"Clothes dryers push lint-laden air. The code cares about length, material, termination, and makeup of that air.","blocks":[{"kind":"note","title":"What to look up","body":"Maximum developed length, whether screws sit in the air stream, booster fans, and termination clearances are mechanical-code dryer-exhaust headings. Confirm in the 2024 IMC and UMC. Do not quote a 2021 Katy field number as the exam answer."},{"kind":"memory","title":"Lint is the point","body":"Screws that catch lint, vinyl that sags, and a termination under a soffit that dumps moist air into an attic are classic traps. Smooth, listed, supported duct is the pattern — the inches are in the book."},{"kind":"note","title":"Exam vs field","body":"PSI Class A uses 2024 IMC / UMC / IFGC. City of Katy currently lists 2021 among adopted construction codes for field permits. Label which world you are answering."},{"kind":"safety","title":"Safety","body":"Restricted dryer exhaust is a fire problem. Look up the current table. Do not guess the foot limit."}],"locator":"2024 IMC clothes-dryer exhaust. 2024 UMC equivalent. PENDING VERIFICATION: exact table number in your edition."},{"id":"hoods","track":"code","domain":"ventilation","fromMemory":true,"title":"Commercial kitchens, hoods, and makeup air","lead":"A hood that takes air out of a building needs a plan for putting air back in.","blocks":[{"kind":"note","title":"Type I vs Type II","body":"Type I hoods handle grease-laden cooking. Type II hoods handle heat and steam. The listing, the appliance, and the mechanical code decide — not the restaurant’s nickname for the hood."},{"kind":"note","title":"Makeup air","body":"Exhaust without makeup air starves the space, spills the hood, and can backdraft nearby combustion appliances. Capacity, interlock, and whether makeup air is heated are lookups in the 2024 mechanical code, not a rule of thumb."},{"kind":"memory","title":"Stem words","body":"Grease duct, cleanouts, makeup air, and Type I/II are ventilation items. Do not open the refrigeration cycle chapter."},{"kind":"safety","title":"Safety","body":"Grease ducts are a fire-rated path. Do not treat them like ordinary HVAC pipe."}],"locator":"2024 IMC/UMC commercial kitchen hoods, exhaust, and makeup air. PENDING VERIFICATION: section titles in your books."},{"id":"salon","track":"code","domain":"ventilation","fromMemory":true,"title":"Nail-salon ventilation","lead":"Nail salons are an occupancy with extra outdoor-air and capture rules because of chemical vapors.","blocks":[{"kind":"note","title":"What the exam is testing","body":"You are being asked whether this occupancy gets ordinary office air or a specific source-capture / exhaust pattern. Find nail salon, manicure, or listed occupancy in the 2024 IMC/UMC ventilation chapter. Do not invent cubic-feet-per-minute-per-station from a forum."},{"kind":"memory","title":"Source capture","body":"Many code patterns want exhaust at the station, not only a ceiling grille in the middle of the room. Confirm the current sentence in your book."},{"kind":"note","title":"Do not mix","body":"This is ventilation (people and process air), not venting (chimneys and dryer ducts)."},{"kind":"safety","title":"Honesty","body":"PENDING VERIFICATION: the exact occupancy table line in your 2024 books. Teach the lookup, not a memorized CFM."}],"locator":"2024 IMC/UMC ventilation — occupancy / nail salon headings. PENDING VERIFICATION: table line."},{"id":"attic","track":"code","domain":"hvac-systems","fromMemory":true,"title":"Attic access and service clearances","lead":"If a technician cannot reach the appliance safely, the install is not finished.","blocks":[{"kind":"note","title":"What to look up","body":"Attic and crawl-space appliances need an opening, a path, and working clearances as stated in the 2024 mechanical code and the listing. Lighting and a receptacle often ride along in the same heading family. Find the section. Do not quote a 24-inch rumor."},{"kind":"memory","title":"Service space is not optional","body":"Nameplate clearances, coil-pull space, and attic walkway rules exist so the next technician is not standing on ceiling joists in the dark."},{"kind":"safety","title":"Safety","body":"Unfloored attics and live electrical around a furnace are fall and shock hazards. The code minimum is the exam floor, not a dare."}],"locator":"2024 IMC/UMC appliance access, attic installation, and clearances. Equipment listing. PENDING VERIFICATION: exact dimensions in your edition."},{"id":"towers","track":"refrigeration","domain":"hvac-systems","fromMemory":true,"title":"Cooling towers","lead":"A cooling tower rejects heat from water to outdoor air. It is not a split-system condenser.","blocks":[{"kind":"note","title":"Job of the tower","body":"Condenser water loop dumps heat at the tower. Approach, range, drift, and basin level are operating ideas. Location, prevailing wind, and discharge relative to intakes are code/siting lookups."},{"kind":"note","title":"What the exam may poke","body":"Bleed-off, strainer, capacity control, and not placing the discharge where it re-enters an outdoor-air intake. Open Modern Refrigeration for components; open the mechanical code for installation clearances."},{"kind":"memory","title":"Do not mix","body":"A cooling tower is water-side heat rejection. A split-system condensing unit is refrigerant-side. Wrong picture, wrong chapter."},{"kind":"safety","title":"Safety","body":"Basin water treatment and legionella control are health issues on real jobs. This lesson is exam navigation, not a water-chemistry course."}],"locator":"Modern Refrigeration — cooling towers / water-cooled equipment. 2024 IMC/UMC cooling-tower siting if present in your edition."},{"id":"gastest","track":"code","domain":"testing","fromMemory":true,"title":"Gas sizing and testing","lead":"Pipe size comes from the IFGC tables. Pressure testing comes from the IFGC test headings. Both are lookups.","blocks":[{"kind":"note","title":"Sizing","body":"Longest-length method, specific gravity, and the appliance load in British thermal units per hour (Btu/h) are how the IFGC sizes pipe. Bring the table. Do not “know” a 3/4-inch answer from a house you once roughed in."},{"kind":"note","title":"Testing","body":"Fuel-gas piping is tested before it is filled with gas. Test medium, pressure, and duration are in the 2024 IFGC. Air or inert gas — not oxygen — is the usual pattern. Confirm the current numbers in the book."},{"kind":"memory","title":"Stem split","body":"If the stem is CFM and friction, you want the ADI wheel. If it is Btu/h and pipe length, you want the IFGC. Wrong tool is a miss even when the math is pretty."},{"kind":"safety","title":"Safety","body":"Never use oxygen to pressure-test fuel gas pipe. Look up the permitted test medium."}],"locator":"2024 IFGC pipe sizing tables and inspection/testing headings. PENDING VERIFICATION: table numbers in your book."},{"id":"drainsize","track":"code","domain":"piping","fromMemory":true,"title":"Condensate size and no downstream reduction","lead":"Once the drain is sized, you do not neck it down on the way to termination.","blocks":[{"kind":"note","title":"The pattern","body":"Mechanical-code condensate headings size the pipe from coil capacity and then require that the drain not be reduced in the direction of flow. A 3/4-inch start that becomes 1/2-inch at the wall is the trap."},{"kind":"note","title":"Slope, trap, materials","body":"Slope, trap, cleanout, and where the water may terminate are in the same family as the earlier condensate lesson. This lesson adds sizing and the no-reduction rule. Confirm both in 2024 IMC and UMC."},{"kind":"memory","title":"Failure path still matters","body":"Secondary drain, auxiliary pan, or approved shutoff when overflow would damage the building — still true. Sizing does not replace that."},{"kind":"safety","title":"Honesty","body":"Do not memorize a tonnage-to-pipe table from a blog. Find the 2024 table. PENDING VERIFICATION: table ID in your edition."}],"locator":"2024 IMC/UMC condensate disposal — size, slope, reduction, termination. Inspection Memory Guide in Library."},{"id":"charge","track":"refrigeration","domain":"service","fromMemory":true,"title":"Charging patterns","lead":"How you charge depends on the metering device and the manufacturer’s method — not a single gauge trick.","blocks":[{"kind":"note","title":"TXV vs fixed orifice","body":"Thermostatic expansion valve (TXV) systems are often charged by subcooling. Fixed-orifice / piston systems are often charged by superheat. Confirm the data plate and the charging chart. Do not apply a TXV chart to a piston coil."},{"kind":"note","title":"Weigh-in","body":"A known-good empty system with a factory charge on the nameplate is a weigh-in job, with line-set adjustments as the manufacturer states. Superheat and subcooling then confirm the result."},{"kind":"memory","title":"One number is not a charge","body":"Low suction by itself is not “add gas.” Combine superheat (SH), subcooling (SC), delta-T, and airflow. Airflow defects mimic charge defects."},{"kind":"safety","title":"Safety","body":"This is a concept lesson. Follow the equipment charging chart and EPA 608 rules. A2L equipment has extra rated-tool and ventilation habits."}],"locator":"Modern Refrigeration — charging methods / TXV and fixed orifice. Equipment charging chart. A2L + Formula Tools in Library."},{"id":"txv","track":"refrigeration","domain":"components","fromMemory":true,"title":"Receivers and thermostatic expansion valves","lead":"A receiver stores spare liquid. A TXV meters liquid to the evaporator by superheat.","blocks":[{"kind":"note","title":"Receiver","body":"A receiver sits in the liquid line after the condenser on many systems that need a place for extra charge. It is not a suction accumulator. The accumulator protects the compressor from liquid. The receiver holds spare liquid for the metering device."},{"kind":"note","title":"TXV parts","body":"Power element (bulb), equalizer, and valve body. The bulb belongs on the suction line at the evaporator outlet, strapped as the manufacturer shows. A lost bulb charge, a wandering bulb, or a clogged inlet screen will starve or flood the coil."},{"kind":"memory","title":"Symptoms","body":"Hunting superheat, high superheat with a full sight glass, or a coil that ices at the outlet first are TXV stories until proven otherwise. Still confirm airflow and charge."},{"kind":"safety","title":"Safety","body":"Concept only. Recover refrigerant before opening a circuit. Match the valve to the refrigerant and capacity."}],"locator":"Modern Refrigeration — metering devices, TXV, receivers, accumulators."},{"id":"controls","track":"electrical","domain":"controls","fromMemory":true,"title":"Controls: temperature, pressure, and safety","lead":"A control is a switch that is either temperature, pressure, time, or a safety that must prove something before the next device can run.","blocks":[{"kind":"note","title":"Families","body":"Temperature: thermostats, limit switches. Pressure: high-pressure cutout, low-pressure cutout, oil-pressure controls. Safety: roll-out, flame prove, condensate float, door interlock. Read the stem for which family you are in."},{"kind":"note","title":"Series safeties","body":"Many safeties are in series with the control voltage. Any open safety stops the sequence. Diagnose by proving which switch is open, not by throwing parts."},{"kind":"memory","title":"High pressure vs low pressure","body":"High-pressure control protects against a blocked condenser or overcharge pattern. Low-pressure control protects against loss of charge or a starved evaporator. They are not interchangeable."},{"kind":"safety","title":"Safety","body":"Jumping a safety to “see if it runs” is a test-bench habit that does not belong on a live furnace. This lesson is recognition, not a live-work procedure."}],"locator":"Modern Refrigeration — controls and safety devices. Equipment wiring diagram."},{"id":"osha","track":"exam","domain":"safety","fromMemory":true,"pending":true,"title":"OSHA 1904 injury reporting","lead":"The permitted OSHA book on this exam is 29 CFR Part 1904 — recording and reporting occupational injuries and illnesses.","blocks":[{"kind":"note","title":"Which book","body":"1904 is recordkeeping: logs, what is recordable, and when you must report a severe event. It is not the whole of OSHA construction safety, and it is not Texas Occupations Code 1302."},{"kind":"note","title":"What to look up","body":"Fatality, in-patient hospitalization, amputation, and loss of an eye have reporting clocks in 1904. Confirm the current hours in the regulation you bring into the room. Do not memorize a number from a blog."},{"kind":"memory","title":"Stem split","body":"If the stem is a dead worker or an amputation on a job, open OSHA 1904. If the stem is who may advertise HVAC in Texas, open Chapter 1302."},{"kind":"safety","title":"Honesty","body":"PENDING VERIFICATION: that you physically have 29 CFR Part 1904 in the form PSI allows. Until then, this is a map to the headings."}],"locator":"OSHA 29 CFR Part 1904. PSI bulletin reference list. PENDING VERIFICATION: your copy."},{"id":"heat","track":"refrigeration","domain":"principles","title":"Heat transfer in one page","lead":"Heat moves from hot to cold by conduction, convection, and radiation. Refrigeration moves heat on purpose.","blocks":[{"kind":"note","title":"Three ways","body":"Conduction is through a solid. Convection is by a fluid in motion. Radiation is electromagnetic — no contact. A condenser uses all three ideas; the exam often wants the name of the dominant one in the stem."},{"kind":"note","title":"Sensible vs latent","body":"Sensible heat changes temperature. Latent heat changes state (boil, condense) at constant temperature for a pure refrigerant at a given pressure. Superheat is sensible heat added to vapor. Subcooling is sensible heat removed from liquid."},{"kind":"memory","title":"Pressure and temperature","body":"For a saturated mixture, pressure and temperature travel together. That is why a gauge reading becomes a saturation temperature on a pressure-temperature (P/T) chart."},{"kind":"safety","title":"Honesty","body":"Formulas for heat (BTU) belong to the permitted references. Map them there before you treat a remembered equation as exam law."}],"locator":"Modern Refrigeration — heat, temperature, and pressure. P/T chart in the same book family."}],"questions":[{"id":"q1","lesson":"ohms","track":"electrical","skill":"Ohm’s law","stem":"A 240-volt heater circuit measures 60 ohms. What is the current?","choices":["2 A","4 A","6 A","8 A"],"answer":1,"why":"I = E ÷ R. 240 ÷ 60 = 4 A.","help":"Cover I. Divide volts by ohms."},{"id":"q2","lesson":"ohms","track":"electrical","skill":"Ohm’s law","stem":"A 120-volt control circuit measures 40 ohms. What is the current?","choices":["2 A","3 A","4 A","8 A"],"answer":1,"why":"I = 120 ÷ 40 = 3 A.","help":"Same formula. 120 ÷ 40."},{"id":"q3","lesson":"ohms","track":"electrical","skill":"Ohm’s law","stem":"A 240-volt circuit measures 30 ohms. What is the current?","choices":["4 A","6 A","8 A","12 A"],"answer":2,"why":"I = 240 ÷ 30 = 8 A.","help":"Divide 240 by 30."},{"id":"q4","lesson":"power","track":"electrical","skill":"True power","stem":"A circuit draws 10 A at 240 V. What is the true power?","choices":["24 W","240 W","2,400 W / 2.4 kW","24,000 W"],"answer":2,"why":"P = I × E. 10 × 240 = 2,400 W = 2.4 kW.","help":"Watts = amps × volts."},{"id":"q5","lesson":"power","track":"electrical","skill":"True power","stem":"A 5 A load on 120 V uses how much power?","choices":["24 W","120 W","600 W","1,200 W"],"answer":2,"why":"5 × 120 = 600 W.","help":"Multiply current by voltage."},{"id":"q14","lesson":"power","track":"electrical","skill":"Units","stem":"How many watts are in 1.5 kW?","choices":["15 W","150 W","1,500 W","15,000 W"],"answer":2,"why":"1 kW = 1,000 W, so 1.5 kW = 1,500 W.","help":"Move the decimal three places."},{"id":"q15","lesson":"ohms","track":"electrical","skill":"Ohm’s law","stem":"A 24-volt control circuit measures 80 ohms. What is the current?","choices":["0.3 A","0.8 A","3 A","8 A"],"answer":0,"why":"I = 24 ÷ 80 = 0.3 A.","help":"Small voltage, larger resistance, small current."},{"id":"q16","lesson":"cycle","track":"refrigeration","skill":"Cycle","stem":"What is the correct order of the four major components in the direction of refrigerant flow?","choices":["Compressor, evaporator, metering device, condenser","Evaporator, compressor, condenser, metering device","Condenser, evaporator, compressor, metering device","Metering device, compressor, evaporator, condenser"],"answer":1,"why":"Vapor leaves the evaporator, is compressed, condenses, then drops pressure at the metering device.","help":"Start at the coil that absorbs heat."},{"id":"q17","lesson":"cycle","track":"refrigeration","skill":"Cycle","stem":"The compressor is best described as:","choices":["A liquid pump that raises oil pressure only","A vapor pump that raises refrigerant pressure and temperature","A device that condenses vapor to liquid","A device that drops pressure so liquid can boil"],"answer":1,"why":"The compressor takes in low-pressure vapor and discharges high-pressure vapor.","help":"Vapor in, vapor out."},{"id":"q18","lesson":"cycle","track":"refrigeration","skill":"Cycle","stem":"Where is heat rejected from the refrigerant in a standard air-cooled split system?","choices":["Evaporator","Metering device","Suction line accumulator only","Condenser"],"answer":3,"why":"The condenser rejects heat so vapor can condense to liquid.","help":"Outdoor coil on a cooling split system."},{"id":"q6","lesson":"sh","track":"refrigeration","skill":"Superheat","stem":"Suction-line temperature is 50°F. Evaporator saturation is 40°F. What is superheat?","choices":["10°F","40°F","50°F","90°F"],"answer":0,"why":"SH = 50 − 40 = 10°F.","help":"Actual vapor temperature minus saturation."},{"id":"q8","lesson":"sh","track":"refrigeration","skill":"Superheat","stem":"Superheat is best described as:","choices":["Liquid cooler than condensing temperature","Vapor warmer than evaporating temperature","The difference between high and low pressure","Compressor oil temperature only"],"answer":1,"why":"Superheat is vapor temperature above saturation.","help":"Think vapor, not liquid."},{"id":"q19","lesson":"sh","track":"refrigeration","skill":"Superheat","stem":"High superheat at the evaporator most often points to:","choices":["A starved coil (underfeed or restriction)","A flooded coil (overfeed)","A condenser fan running too fast only","Correct charge with no other clues"],"answer":0,"why":"If vapor is much hotter than saturation, the coil ran out of liquid early.","help":"High SH = hungry coil."},{"id":"q7","lesson":"sc","track":"refrigeration","skill":"Subcooling","stem":"Condenser saturation is 110°F. Liquid-line temperature is 95°F. What is subcooling?","choices":["15°F","95°F","110°F","205°F"],"answer":0,"why":"SC = 110 − 95 = 15°F.","help":"Saturation minus actual liquid temperature."},{"id":"q9","lesson":"sc","track":"refrigeration","skill":"Subcooling","stem":"Subcooling is best described as:","choices":["Vapor warmer than evaporating temperature","Liquid cooler than condensing temperature","The amp draw of the condenser fan","Filter-drier pressure drop only"],"answer":1,"why":"Subcooling is liquid temperature below saturation.","help":"Think liquid line."},{"id":"q20","lesson":"sc","track":"refrigeration","skill":"Subcooling","stem":"Very low subcooling with a warm liquid line most often points to:","choices":["Overcharge","Undercharge or a condenser that is not making liquid","Correct charge","A suction-line restriction only"],"answer":1,"why":"If liquid is barely cooler than saturation, there is little leftover liquid in the condenser.","help":"Low SC = not much liquid stacked in the condenser."},{"id":"q21","lesson":"a2l","track":"refrigeration","skill":"A2L","stem":"ASHRAE 34 class A2L means the refrigerant is:","choices":["Higher toxicity and nonflammable","Lower toxicity and mildly flammable","A toxic gas with no flame risk","The same service class as older A1 refrigerants"],"answer":1,"why":"A is lower toxicity. 2L is mild flammability.","help":"A2L is not A1."},{"id":"q22","lesson":"a2l","track":"refrigeration","skill":"A2L","stem":"When servicing an A2L system you should:","choices":["Use any leftover A1 recovery machine and ignore the nameplate","Follow the nameplate, use rated tools, and respect charge limits","Vent leftover charge because A2L is harmless","Add propane to “boost cooling”"],"answer":1,"why":"Mildly flammable still means rated equipment, listed charge, and no improvising.","help":"Nameplate and listing win."},{"id":"q23","lesson":"vac","track":"refrigeration","skill":"Vacuum","stem":"Recovery means:","choices":["Reprocessing refrigerant to a purity standard","Removing refrigerant from a system into a cylinder","Pulling a micron vacuum only","Adding nitrogen until the gauges look even"],"answer":1,"why":"Recovery moves refrigerant out of the system. Reclaim is a plant process. Vacuum is air and moisture.","help":"Three different words: recover, recycle, reclaim."},{"id":"q24","lesson":"vac","track":"refrigeration","skill":"Vacuum","stem":"A micron gauge should be read:","choices":["On the vacuum pump exhaust only","On the system, after isolating the pump for a hold test","On the recovery cylinder only","On the suction gauge in psig"],"answer":1,"why":"You need to know what the system is doing. A pump can look deep while the system is still wet or leaking.","help":"Isolate and watch the rise."},{"id":"q25","lesson":"condensate","track":"code","skill":"Condensate","stem":"If a clogged condensate drain would damage the building, the mechanical code pattern is to provide:","choices":["No extra protection; the primary drain is enough","A secondary drain, auxiliary pan, or approved automatic shutoff — confirm the current book","A hose onto the nearest sidewalk","An open tee in a return-air plenum"],"answer":1,"why":"The exam skill is the failure path: protect the building. The exact method is in the 2024 IMC/UMC condensate heading.","help":"Look up condensate disposal, not the duct chapter."},{"id":"q26","lesson":"condensate","track":"code","skill":"Condensate","stem":"Which book do you open first for a condensate termination question on a cooling coil?","choices":["IFGC only","Texas Occupations Code 1302","2024 IMC or UMC","OSHA 1904"],"answer":2,"why":"Condensate from mechanical cooling is a mechanical-code topic.","help":"Gas book is the wrong family."},{"id":"q27","lesson":"gas","track":"code","skill":"Fuel gas","stem":"A question about CSST bonding or gas pipe sizing should send you to:","choices":["2024 IFGC","Modern Refrigeration only","OSHA 1904","The ADI duct calculator"],"answer":0,"why":"Fuel gas piping and CSST rules live in the International Fuel Gas Code.","help":"Stem says gas → IFGC."},{"id":"q28","lesson":"gas","track":"code","skill":"Fuel gas","stem":"A sediment trap (drip leg) on a gas appliance is:","choices":["A condensate accessory from the IMC only","An IFGC / appliance-connection detail you look up, not invent","Required on every water heater vent","The same as a refrigerant filter-drier"],"answer":1,"why":"Sediment traps are fuel-gas appliance piping. Confirm when and where in the current IFGC.","help":"Do not answer gas details from the refrigeration book."},{"id":"q29","lesson":"vent","track":"code","skill":"Venting","stem":"A Category IV condensing appliance typically requires:","choices":["A negative-draft masonry chimney with no listing check","A listed positive-pressure vent system made for that appliance","No vent because it is electric","The same vent as any Category I draft-hood furnace"],"answer":1,"why":"Category IV is positive-pressure and condensing. Use the listed vent. Confirm in the IFGC and the nameplate.","help":"Category tells you the vent family."},{"id":"q30","lesson":"vent","track":"code","skill":"Venting","stem":"Termination clearances for a gas vent to a window or air intake are found in:","choices":["The Ohm’s law chapter","2024 IFGC venting / termination headings","16 TAC Chapter 75 only","EPA 608"],"answer":1,"why":"How far a vent must sit from openings is a fuel-gas venting lookup.","help":"Do not memorize every inch. Find the table."},{"id":"q31","lesson":"ducts","track":"code","skill":"Ducts","stem":"Which approved tool is built for duct sizing practice in this exam family?","choices":["A micron gauge","The ADI Duct Size Calculator","A refrigerant scale","A manometer only"],"answer":1,"why":"The ADI calculator is on the approved reference list. Practice the wheel before test day.","help":"Library lists it under paper books for the PSI room."},{"id":"q32","lesson":"ducts","track":"code","skill":"Ducts","stem":"Flexible duct should be:","choices":["Left compressed on the coil so it “has slack”","Stretched, supported, and installed to the listing / mechanical-code rules","Run through a garage as the only return for a dwelling","Used as a gas vent liner"],"answer":1,"why":"Compressed flex is undersized in practice. Support and stretch it. Return air from a garage is a separate code problem.","help":"Install the duct like the book and the listing, not like a leftover scrap."},{"id":"q33","lesson":"law","track":"code","skill":"Texas law","stem":"The public statute that frames who may contract air conditioning and refrigeration in Texas is:","choices":["IMC Chapter 3 only","Texas Occupations Code Chapter 1302","ASHRAE 34","AHRI 700"],"answer":1,"why":"Chapter 1302 is the ACR license law. Mechanical code is how you build. 1302 is who may contract.","help":"Law book, not the UMC, for contracting questions."},{"id":"q34","lesson":"law","track":"code","skill":"Texas law","stem":"Advertising air conditioning contracting in Texas without the proper license is:","choices":["Allowed if the ad is only on social media","A 1302 / TDLR issue you look up in the law book, not a code-table issue","Handled only by the IFGC","Ignored if you hold EPA 608"],"answer":1,"why":"EPA 608 is federal refrigerant work. Texas advertising and contracting sit in 1302 and TAC 75.","help":"Wrong credential family."},{"id":"q35","lesson":"lookup","track":"exam","skill":"Lookup","stem":"The stem mentions CSST and a 120,000 Btu gas furnace. Which book do you pick up first?","choices":["2024 IFGC","Modern Refrigeration","OSHA 1904","2024 IMC condensate only"],"answer":0,"why":"Gas + CSST is the IFGC. Do not start in the refrigeration text.","help":"Read the stem for the book family before you hunt a page."},{"id":"q36","lesson":"lookup","track":"exam","skill":"Lookup","stem":"What may you bring into the PSI room as a study aid?","choices":["Printed custom packets and this website on a phone","Only the current approved reference books, with permanent commercial tabs allowed","Any older 2021 code book plus handwritten notes","A friend’s marked-up desk pack"],"answer":1,"why":"Approved references only. Custom packets stay home. Confirm the current bulletin.","help":"Desk packs are home tools."},{"id":"q10","lesson":"exam","track":"exam","skill":"Exam frame","stem":"How many scored items are on the Texas Environmental Air Class A exam?","choices":["60","80","120","200"],"answer":2,"why":"The current bulletin frame is 120 scored items.","help":"Plus extra non-scored items."},{"id":"q11","lesson":"exam","track":"exam","skill":"Exam frame","stem":"What score is needed to pass?","choices":["60%","65%","70%","80%"],"answer":2,"why":"70% is the pass mark in the current bulletin.","help":"Count correct scored items."},{"id":"q12","lesson":"exam","track":"exam","skill":"Open book","stem":"What should you bring into the PSI exam room?","choices":["Custom study packets and printed notes","Only the current approved reference books","Your phone with this website open","Any older 2021 code book"],"answer":1,"why":"Bring only current approved references. Leave custom packets at home.","help":"Desk packs are home tools."},{"id":"q13","lesson":"exam","track":"exam","skill":"Codes","stem":"Exams on or after September 1, 2026 use which code year?","choices":["2018","2021","2024","2027"],"answer":2,"why":"2024 UMC, IMC, and IFGC apply on or after that date.","help":"Do not study from retired 2021 books for this date."},{"id":"q40","lesson":"flex","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Flex compression","stem":"You cut 25 feet of flexible duct and install it into a 21.25-foot run. What is the compression, and what does “compression” mean here?","choices":["15% — bunched / not fully stretched flex (not compressor ratio)","15% — compressor compression ratio","4% — near-stretched baseline","30% — kinks only, never extra length"],"answer":0,"why":"Compression % = (cut − installed) ÷ cut × 100. (25 − 21.25) ÷ 25 = 0.15 = 15%. In this project, compression means bunched flex.","help":"Subtract installed from cut, divide by cut.","explain":["Correct. 3.75 ÷ 25 = 15%. The liner is wrinkled, so friction rises.","Wrong family. Compressor ratio is refrigeration. This is duct install.","About 4% is the near-stretched ADI-style baseline, not this install.","30% would be a more crushed run. Kinks add loss on top of compression."]},{"id":"q41","lesson":"flex","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Flex compression","stem":"Three identical flex runs move the same cubic feet per minute (CFM). One is near 4% compression, one 15%, one 30%. Which ranking of pressure loss is expected?","choices":["4% highest, 30% lowest","All three equal if CFM is equal","30% highest, then 15%, then 4% lowest","15% always higher than 30% because it is “tighter”"],"answer":2,"why":"More bunching → smaller effective path and more roughness → more pressure loss. 30% is worst among these three straight-run cases. Bends and sag can make any of them worse.","help":"More wrinkles, more friction.","explain":["Backwards. Near-stretched duct is the easier path.","Equal CFM does not mean equal friction. The path changed.","Correct. Rank by how crushed the liner is.","30% is more compressed than 15%, so it is not the easier run."]},{"id":"q42","lesson":"flex","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Flex compression","stem":"A flex run is coiled on top of the coil with several extra feet shoved in “for slack.” The equipment is short of airflow. What should you do first?","choices":["Up-size the whole trunk from the ADI wheel and leave the coil of flex","Stretch, support, and install the flex as listed, then re-check airflow","Close return grilles to raise static until CFM “looks right”","Add refrigerant because low airflow always means undercharge"],"answer":1,"why":"The install defect is the first repair. A wheel cannot legalize a wrinkled leftover scrap. Low airflow also mimics charge problems — fix air first.","help":"Pull it tight. Support it. Then measure.","explain":["Sizing around a defect leaves the defect.","Correct. Restore the listed install, then test.","Closing returns raises static and usually makes airflow worse.","Charge is a different diagnosis. Airflow defects fake charge symptoms."]},{"id":"q43","lesson":"static","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Static pressure","stem":"Total external static pressure (TESP) is best described as:","choices":["Refrigerant high-side pressure in pounds per square inch gauge (psig)","The extra duct-side work the blower sees outside the cabinet, typically in inches of water column (in. w.c.)","Indoor wet-bulb only","Gas-manifold pressure in inches of water column used as a duct reading"],"answer":1,"why":"TESP is air-side, usually supply static plus return static, compared with the nameplate external static rating. Gas manifold pressure uses the same unit name and is a different test.","help":"Blower vs ducts, not refrigerant gauges.","explain":["That is the refrigeration high side.","Correct. Air pushing on duct walls, in in. w.c.","Wet-bulb is a charging / capacity reading.","Same unit, different job. Do not put a manifold number on a duct formula."]},{"id":"q44","lesson":"static","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Air balancing","stem":"A closed-door bedroom with a supply and no return path usually causes:","choices":["Lower static and more airflow through that room","A pressurized room, less air delivered, and a starved return to the blower","Higher subcooling only","A larger gas pipe requirement"],"answer":1,"why":"Air that cannot get back to the blower piles up in the room. The blower starves. Comfort and static both suffer. Jump-door undercuts or a return path are the design pattern — confirm in Manual D / the mechanical code, not a forum.","help":"Blower needs its air back.","explain":["Opposite. The room becomes a dead end.","Correct. Pressure in the room, starve the return.","Subcooling is liquid-line refrigeration.","Gas pipe is an IFGC problem, not this stem."]},{"id":"q45","lesson":"filters","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Filters","stem":"A high-pressure-drop filter the equipment was not selected for will typically:","choices":["Raise static, cut cubic feet per minute (CFM), and can freeze a coil or trip limits","Increase CFM and lower static","Only change superheat, never airflow","Satisfy combustion air for a furnace"],"answer":0,"why":"The filter is in the air path. Extra drop is extra static. Capacity and safety switches follow the missing air.","help":"Think of the filter as a damper you did not size.","explain":["Correct. Extra restriction, less air, secondary symptoms.","Backwards.","Airflow changes first. Charge readings then lie.","Combustion air is a separate IFGC path. A return filter is not that path."]},{"id":"q46","lesson":"filters","track":"code","domain":"air-distribution","fromMemory":true,"skill":"Return air","stem":"Return air taken from an attached garage is a problem because:","choices":["Garages are always the best mixed-air source","Vehicle fumes and other contaminants can enter the occupied duct system — look up the mechanical-code prohibition","It automatically sizes the ADI wheel","It is required for Type I hood makeup air"],"answer":1,"why":"Codes keep return air out of garages and similar hazardous spaces. Confirm the current 2024 IMC/UMC sentence. Do not invent an exception.","help":"Fumes in, people breathe it.","explain":["Not a mixed-air strategy.","Correct. Look up return-air sources.","The wheel sizes ducts. It does not bless a garage return.","Kitchen makeup air is a different ventilation job."]},{"id":"q47","lesson":"wheel","track":"code","domain":"air-distribution","pending":true,"skill":"ADI calculator","stem":"On a duct calculator, a typical first setup when you already know airflow (CFM) and a design friction rate is to read:","choices":["Refrigerant saturation temperature","Duct size and approximate velocity","Gas pipe diameter in the IFGC","OSHA 1904 reporting hours"],"answer":1,"why":"That is the common “size this run” setup. Exact window names on your ADI wheel are pending photo verification. Do not mix the gas tables into the wheel.","help":"CFM + friction → size / velocity.","explain":["That is a P/T chart.","Correct. Then check whether velocity is reasonable.","Wrong book. Btu/h and length belong in the IFGC.","Wrong book. Injury reporting is 1904."]},{"id":"q48","lesson":"wheel","track":"code","domain":"air-distribution","pending":true,"skill":"Friction rate","stem":"A simple planning relationship for duct friction rate is:","choices":["Friction rate ≈ available static pressure ÷ total effective length (confirm units in Manual D / the wheel)","Friction rate = superheat ÷ subcooling","Friction rate = Btu/h ÷ cubic feet of combustion air","Friction rate is always 0.10 regardless of the job"],"answer":0,"why":"You spread the static you can spend across the effective length you must travel. Confirm the exact Manual D method and units. Do not treat 0.10 in. w.c. per 100 ft as a religion.","help":"Static you may spend, divided by how long the path is.","explain":["Correct as a planning idea. Verify the method in the permitted books.","Those are charging numbers.","Those are combustion-air / gas numbers.","A single friction rate is a habit, not a law."]},{"id":"q49","lesson":"loads","track":"exam","domain":"equipment-design","pending":true,"skill":"Manual map","stem":"Which pairing is correct?","choices":["Manual J = duct sizing, Manual D = load, Manual S = vent category","Manual J = residential load, Manual S = equipment selection, Manual D = residential duct design","Manual J = OSHA log, Manual S = IFGC pipe, Manual D = condensate","All three manuals are optional if you own a duct calculator"],"answer":1,"why":"J load, S match the equipment, D duct the air. The ADI wheel is a tool inside that process, not a replacement for J or S. Ownership of your copies is still pending verification.","help":"J load. S pick. D ducts.","explain":["Those jobs are swapped.","Correct.","Wrong books entirely.","The wheel does not calculate a house load."]},{"id":"q50","lesson":"loads","track":"exam","domain":"equipment-design","skill":"Sensible vs latent","stem":"Sensible capacity vs latent capacity:","choices":["Sensible changes air temperature; latent handles moisture (phase change of water)","Sensible is only refrigerant subcooling; latent is only Ohm’s law","They are the same number on every nameplate","Latent is duct velocity; sensible is gas specific gravity"],"answer":0,"why":"A coil that is oversized on total British thermal units per hour (Btu/h) but short on latent can make a cold, wet room. Selection has to match both pieces of the load.","help":"Sensible = thermometer. Latent = moisture.","explain":["Correct.","Those are other subjects.","Nameplates split total, sensible, and sometimes airflow. They are not identical.","Wrong families."]},{"id":"q51","lesson":"combustion","track":"code","domain":"combustion-air","fromMemory":true,"skill":"Combustion air","stem":"A gas furnace in a small, tight mechanical room needs combustion air. Which book do you open first?","choices":["2024 International Fuel Gas Code (IFGC)","OSHA 29 CFR Part 1904 only","The ADI duct calculator only","Texas Occupations Code Chapter 1302"],"answer":0,"why":"Air for fuel-burning appliances is an IFGC heading (with mechanical-code overlap). Law books and injury logs will not size an opening.","help":"Stem says gas appliance air → IFGC.","explain":["Correct. Find combustion air / air for combustion.","1904 is injury recording.","The wheel sizes ducts, not combustion openings.","1302 is who may contract, not how much air a burner needs."]},{"id":"q52","lesson":"combustion","track":"code","domain":"combustion-air","fromMemory":true,"pending":true,"skill":"Combustion air","stem":"Two openings, one high and one low, in a confined mechanical room is a pattern you should treat as:","choices":["A dryer-exhaust detail","A combustion-air arrangement you confirm in the current IFGC tables — do not invent square inches","A Type I grease-duct cleanout rule","A TXV equalizer location"],"answer":1,"why":"High and low openings are a classic indoor-combustion-air picture. The square inches and when outdoor air is required are in the book. PENDING: exact table in your edition.","help":"High/low openings = combustion air, not dryer.","explain":["Dryer exhaust is a different venting heading.","Correct. Look up the table.","Grease ducts are commercial kitchen ventilation.","TXV is refrigeration."]},{"id":"q53","lesson":"dryer","track":"code","domain":"venting","fromMemory":true,"pending":true,"skill":"Dryer exhaust","stem":"Screws in a dryer exhaust duct that stick into the air stream are a problem because:","choices":["They improve velocity","They catch lint and can create a fire load — confirm the current mechanical-code fastening rule","They are required by the IFGC gas-pipe chapter","They replace the need for a termination hood"],"answer":1,"why":"Lint hangs on inward fasteners. Codes typically want listed fasteners that do not obstruct. Find the 2024 IMC/UMC sentence rather than quoting a 2021 field memory.","help":"Lint + screw points = fire.","explain":["Obstructions do not “improve” this duct.","Correct. Look up dryer exhaust construction.","Wrong chapter family.","Termination is a separate requirement."]},{"id":"q54","lesson":"dryer","track":"code","domain":"venting","fromMemory":true,"skill":"Exam vs field code","stem":"You are answering a PSI Environmental Air Class A item about dryer-exhaust length. Which code year is the exam basis on or after September 1, 2026?","choices":["2021 IMC/UMC, because that is what City of Katy currently lists for field permits","2024 IMC/UMC (and IFGC where it applies) — keep Katy’s adopted field code in a separate mental drawer","2018 only","Whatever year is printed on a neighbor’s permit card"],"answer":1,"why":"The bulletin locked 2024 books for exams on/after that date. City of Katy field permits can lag. Never mix the two on a timed item.","help":"Exam = 2024. Katy field ≠ exam.","explain":["True about Katy field work, false about the PSI exam.","Correct.","Retired for this exam date.","A local card is not the candidate bulletin."]},{"id":"q55","lesson":"hoods","track":"code","domain":"ventilation","fromMemory":true,"skill":"Kitchen hoods","stem":"A Type I hood is for:","choices":["Grease-laden cooking effluent","Heat and steam only, never grease","Clothes-dryer lint","Nail-salon source capture only"],"answer":0,"why":"Type I = grease. Type II = heat/steam. Confirm listings and the 2024 mechanical-code hood chapter.","help":"Type I grease. Type II steam.","explain":["Correct.","That is Type II.","Dryer exhaust is venting, not a kitchen hood type.","Nail salon is a different ventilation occupancy."]},{"id":"q56","lesson":"hoods","track":"code","domain":"ventilation","fromMemory":true,"skill":"Makeup air","stem":"A large kitchen exhaust with no makeup air can:","choices":["Improve combustion at nearby appliances","Depressurize the space, spill the hood, and backdraft nearby fuel appliances","Replace the grease duct","Count as combustion air for a Category IV furnace"],"answer":1,"why":"Air that leaves must be replaced. Negative building pressure is a hood-capture and carbon monoxide problem. Look up makeup-air capacity and interlocks.","help":"What goes out must come in.","explain":["Starving the building hurts combustion.","Correct.","Grease duct is the dirty exhaust path, not makeup air.","Category IV venting is a different IFGC job."]},{"id":"q57","lesson":"salon","track":"code","domain":"ventilation","fromMemory":true,"pending":true,"skill":"Nail salon","stem":"A nail-salon ventilation question should send you to:","choices":["The 2024 IMC/UMC ventilation occupancy / source-capture headings — not a memorized forum CFM","The Ohm’s law chapter only","OSHA 1904 injury-log hours only","The ADI wheel friction window only"],"answer":0,"why":"This occupancy has extra chemical-vapor rules. Find the current table line. PENDING VERIFICATION of the exact line in your book. Do not invent cubic feet per minute per station.","help":"Ventilation chapter, not the wheel.","explain":["Correct. Look it up every time.","Electrical math will not clear vapors.","1904 is recordkeeping after someone is hurt.","The wheel sizes ducts after you know the air quantity."]},{"id":"q58","lesson":"attic","track":"code","domain":"hvac-systems","fromMemory":true,"pending":true,"skill":"Access","stem":"An attic-mounted air handler with no floored path, no opening sized for the appliance, and no service lighting is primarily a miss of:","choices":["Refrigerant recovery procedure","Appliance access / attic installation / working-clearance rules in the 2024 mechanical code and the listing","Texas advertising law","A2L safety class only"],"answer":1,"why":"If you cannot reach it safely, the install is incomplete. Exact opening size and lighting details are lookups — PENDING your edition. Do not quote a rumor dimension.","help":"Can a technician get there with tools?","explain":["Recovery is how you empty a circuit, not how you reach the unit.","Correct.","1302 does not size attic hatches.","A2L is refrigerant class, not attic access."]},{"id":"q59","lesson":"towers","track":"refrigeration","domain":"hvac-systems","fromMemory":true,"skill":"Cooling towers","stem":"A cooling tower’s job is to:","choices":["Meter refrigerant into the evaporator","Reject heat from a water loop to outdoor air","Provide combustion air to a Category I furnace","Replace a Type I grease filter"],"answer":1,"why":"Tower = water-side heat rejection. A split-system condensing unit is refrigerant-side. Do not mix the pictures.","help":"Water loop, outdoor air, heat out.","explain":["That is a TXV / metering device.","Correct.","Combustion air is IFGC.","Kitchen ventilation is a different chapter."]},{"id":"q60","lesson":"gastest","track":"code","domain":"testing","fromMemory":true,"skill":"Gas test medium","stem":"Fuel-gas piping is being pressure-tested before it is put in service. Which test medium is the pattern you must confirm in the IFGC?","choices":["Oxygen, because it is cheap","Air or an inert gas as the current IFGC allows — never oxygen","Liquid refrigerant 410A","The same as a dryer-exhaust smoke test"],"answer":1,"why":"Oxygen and fuel gas are a violence waiting to happen. Look up permitted medium, pressure, and duration. Do not import a number from memory.","help":"No oxygen in gas pipe tests.","explain":["Dangerous and not the code pattern.","Correct. Confirm the current IFGC test heading.","Wrong system.","Wrong test family."]},{"id":"q61","lesson":"gastest","track":"code","domain":"testing","fromMemory":true,"pending":true,"skill":"Gas sizing tool","stem":"A stem gives appliance load in Btu/h, longest length, and asks for steel-pipe size. You pick up:","choices":["The ADI duct calculator","The 2024 IFGC pipe-sizing table (longest-length method unless the book says otherwise)","OSHA 1904","A P/T chart"],"answer":1,"why":"Btu/h + length + gas pipe = IFGC tables. The duct wheel will not save you. PENDING: exact table number in your copy.","help":"Btu and pipe → IFGC, not ADI.","explain":["Wrong tool. That is air.","Correct.","Injury log.","Refrigerant saturation."]},{"id":"q62","lesson":"drainsize","track":"code","domain":"piping","fromMemory":true,"skill":"No downstream reduction","stem":"A cooling coil condensate drain starts at the size required by the mechanical code and then is reduced one size before it leaves the building. That reduction is:","choices":["Required so the trap will siphon","A violation of the usual “do not reduce in the direction of flow” pattern — confirm in the 2024 IMC/UMC","How you size combustion air","Required on every Category IV vent"],"answer":1,"why":"Once sized, the drain stays that size or larger downstream. Necking it down is the remembered trap. Exact table still pending in your edition.","help":"Do not neck the drain down on the way out.","explain":["Traps need slope and depth from the book, not a smaller outlet.","Correct.","Wrong subject.","Wrong subject."]},{"id":"q63","lesson":"drainsize","track":"code","domain":"piping","fromMemory":true,"skill":"Condensate sizing","stem":"Condensate pipe size for a cooling coil is based on:","choices":["The ADI friction rate window","The mechanical-code condensate table / heading using coil capacity — not a blog tonnage chart","Chapter 1302 advertising rules","OSHA 1904 recording criteria"],"answer":1,"why":"Capacity → table → size, then no downstream reduction, plus slope/trap/termination. Do not memorize a 3/4-inch religion.","help":"Open condensate disposal, not 1302.","explain":["Air tool.","Correct. Find the 2024 table.","Who may contract.","Injury log."]},{"id":"q64","lesson":"charge","track":"refrigeration","domai
